<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Resto - Mie Bangka Teladan</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <link class="main-css" rel="stylesheet" href="https://cloudflare.com">
    <script>
        // --- AMAN: PROTEKSI KEAMANAN TERBARU ---
        function checkAdminAuth() {
            if (sessionStorage.getItem('mb_admin_logged') !== 'true') {
                const loginModal = document.getElementById('login-modal');
                if (loginModal) {
                    loginModal.classList.remove('hidden');
                }
                
                const phoneLabel = document.getElementById('display-phone-label');
                if (phoneLabel) {
                    phoneLabel.innerText = localStorage.getItem('mb_admin_phone') || "081267166886";
                }

                // Proteksi dari Inspect Element: Jika modal dihapus paksa, otomatis ditendang keluar
                window.securityCheckInterval = setInterval(() => {
                    const modalCheck = document.getElementById('login-modal');
                    if (sessionStorage.getItem('mb_admin_logged') !== 'true') {
                        if (!modalCheck || modalCheck.classList.contains('hidden')) {
                            clearInterval(window.securityCheckInterval);
                            window.location.href = "index.html";
                        }
                    } else {
                        clearInterval(window.securityCheckInterval);
                    }
                }, 100);

            } else {
                if (window.securityCheckInterval) clearInterval(window.securityCheckInterval);
                const loginModal = document.getElementById('login-modal');
                if (loginModal) {
                    loginModal.classList.add('hidden');
                }
                if (typeof initAdminPanel === 'function') {
                    initAdminPanel();
                }
            }
        }

        function verifyAdminLogin() {
            let usernameInput = document.getElementById('admin-username').value.trim();
            let passwordInput = document.getElementById('admin-password').value.trim();
            let pinInput = document.getElementById('admin-pin').value.trim();

            let correctUsername = localStorage.getItem('mb_admin_user') || "miebangka";
            let correctPassword = localStorage.getItem('mb_admin_pass') || "admin123";
            let correctPin = localStorage.getItem('mb_admin_pin') || "886886";

            if (usernameInput !== correctUsername || passwordInput !== correctPassword) { 
                alert('Nama Resto atau Sandi salah.'); 
                return; 
            }
            if (pinInput !== correctPin) { 
                alert('PIN Rahasia Resto salah.'); 
                return; 
            }

            sessionStorage.setItem('mb_admin_logged', 'true');
            if (window.securityCheckInterval) clearInterval(window.securityCheckInterval);
            
            alert('Masuk Panel Resto Berhasil.');
            document.getElementById('login-modal').classList.add('hidden');
            
            if (typeof initAdminPanel === 'function') {
                initAdminPanel();
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('mb_admin_logged');
            alert('Anda telah keluar.');
            window.location.reload();
        }

        function toggleVisibility(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') { 
                field.type = 'text'; 
                icon.className = 'fa-solid fa-eye-slash text-gray-500'; 
            } else { 
                field.type = 'password'; 
                icon.className = 'fa-solid fa-eye text-gray-500'; 
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans selection:bg-sky-500 selection:text-white" onload="checkAdminAuth()">

    <!-- Modal Login -->
    <div id="login-modal" class="fixed inset-0 bg-sky-900 bg-opacity-95 hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center">
            <div class="w-14 h-14 bg-sky-600 text-white rounded-full flex items-center justify-center text-2xl mx-auto mb-3 shadow">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="text-2xl font-bold text-sky-900 mb-1">Login Panel Resto</h3>
            <p class="text-xs text-gray-500 mb-4">Pemilik Terdaftar HP: <b id="display-phone-label">081267166886</b></p>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-700">Nama Resto</label>
                    <input type="text" id="admin-username" placeholder="miebangka" class="w-full px-3 py-2 border rounded-xl mt-1 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700">Sandi Resto</label>
                    <div class="relative mt-1">
                        <input type="password" id="admin-password" placeholder="••••••••" class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-sky-500 pr-10">
                        <button type="button" onclick="toggleVisibility('admin-password', 'eye-pass')" class="absolute right-3 top-2.5 text-sm"><i id="eye-pass" class="fa-solid fa-eye text-gray-500"></i></button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700">PIN Rahasia (6 Digit)</label>
                    <div class="relative mt-1">
                        <input type="password" id="admin-pin" placeholder="886886" maxlength="6" class="w-full px-3 py-2 border rounded-xl text-sm tracking-widest text-center font-bold outline-none focus:ring-2 focus:ring-sky-500 pr-10">
                        <button type="button" onclick="toggleVisibility('admin-pin', 'eye-pin')" class="absolute right-3 top-2.5 text-sm"><i id="eye-pin" class="fa-solid fa-eye text-gray-500"></i></button>
                    </div>
                </div>
            </div>
            <button onclick="verifyAdminLogin()" class="w-full mt-5 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl transition shadow">Masuk ke Panel Resto</button>
        </div>
    </div>

    <!-- Wrapper Admin Panel -->
    <div class="min-h-screen flex flex-col">
        <header class="bg-sky-900 text-white shadow-md">
            <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-4 w-full sm:w-auto">
                    <h1 class="text-base sm:text-lg font-bold text-center sm:text-left"><i class="fa-solid fa-gauge-high mr-2"></i> Panel Resto - Mie Bangka Teladan</h1>
                    <div class="flex items-center bg-sky-800 px-3 py-1 rounded-xl border border-sky-700 text-xs font-bold">
                        <span class="mr-2">Status Web:</span>
                        <select id="header-resto-status" onchange="changeRestoStatus(this.value)" class="bg-white text-sky-900 px-2 py-0.5 rounded font-bold outline-none">
                            <option value="Buka">BUKA (Aktif)</option>
                            <option value="Tutup">TUTUP (Offline)</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Keluar</button>
                    <a href="index.html" target="_blank" class="bg-white text-sky-900 hover:bg-sky-50 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow"><i class="fa-solid fa-globe mr-1"></i> Buka Web</a>
                </div>
            </div>
        </header>

        <nav class="bg-sky-800 text-white text-sm shadow overflow-x-auto">
            <div class="container mx-auto px-4 flex space-x-6 py-3 whitespace-nowrap">
                <button onclick="switchTab('orders')" id="tab-btn-orders" class="font-bold border-b-2 border-white pb-1">Kelola Pesanan</button>
                <button onclick="switchTab('menus')" id="tab-btn-menus" class="text-sky-200 hover:text-white pb-1">Kelola Menu</button>
                <button onclick="switchTab('banners')" id="tab-btn-banners" class="text-sky-200 hover:text-white pb-1">Pengaturan Banner</button>
                <button onclick="switchTab('banks')" id="tab-btn-banks" class="text-sky-200 hover:text-white pb-1">Bank & E-Wallet</button>
                <button onclick="switchTab('settings')" id="tab-btn-settings" class="text-sky-200 hover:text-white pb-1">Pengaturan Resto</button>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-8 flex-grow max-w-7xl">
            <!-- TAB 1: KELOLA PESANAN -->
            <div id="section-orders" class="space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h3 class="text-lg sm:text-xl font-bold text-gray-800">Daftar Pesanan Masuk & Pantauan Waktu</h3>
                    <button onclick="clearOrders()" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1.5 rounded-lg text-xs font-bold transition">Hapus Semua Riwayat</button>
                </div>
