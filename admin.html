<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mie Bangka Teladan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Wrapper -->
    <div class="min-h-screen flex flex-col">
        
        <!-- Header Admin -->
        <header class="bg-gray-900 text-white shadow-md">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold"><i class="fa-solid fa-gauge-high mr-2"></i> Admin Panel - Mie Bangka</h1>
                <a href="index.html" target="_blank" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm transition">
                    <i class="fa-solid fa-globe mr-1"></i> Kunjungi Web
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8 flex-grow">
            
            <!-- Statistik Ringkas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex items-center">
                    <div class="p-4 bg-amber-100 text-amber-700 rounded-xl mr-4 text-2xl"><i class="fa-solid fa-clipboard-list"></i></div>
                    <div>
                        <p class="text-gray-500 text-sm">Total Pesanan Masuk</p>
                        <h3 id="stat-orders" class="text-2xl font-bold">0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex items-center">
                    <div class="p-4 bg-green-100 text-green-700 rounded-xl mr-4 text-2xl"><i class="fa-solid fa-bowl-food"></i></div>
                    <div>
                        <p class="text-gray-500 text-sm">Total Menu Aktif</p>
                        <h3 id="stat-menus" class="text-2xl font-bold">0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex items-center">
                    <div class="p-4 bg-blue-100 text-blue-700 rounded-xl mr-4 text-2xl"><i class="fa-solid fa-wallet"></i></div>
                    <div>
                        <p class="text-gray-500 text-sm">Pendapatan Selesai</p>
                        <h3 id="stat-revenue" class="text-2xl font-bold">Rp 0</h3>
                    </div>
                </div>
            </div>

            <!-- Tab Navigasi -->
            <div class="flex space-x-4 mb-6 border-b border-gray-300 pb-3">
                <button onclick="switchTab('orders')" id="btn-tab-orders" class="font-bold text-amber-700 border-b-2 border-amber-700 pb-2 px-2 transition">Kelola Pesanan Masuk</button>
                <button onclick="switchTab('menus')" id="btn-tab-menus" class="font-bold text-gray-500 pb-2 px-2 transition">Kelola Daftar Menu</button>
            </div>

            <!-- TAB 1: KELOLA PESANAN -->
            <div id="tab-orders" class="space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Daftar Pesanan Pembeli</h3>
                    <button onclick="clearOrders()" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1.5 rounded-lg text-sm transition">Hapus Semua Riwayat</button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-200">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">ID / Waktu</th>
                                    <th class="p-4">Pemesan & Alamat</th>
                                    <th class="p-4">Detail Pesanan</th>
                                    <th class="p-4">Total</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body" class="divide-y divide-gray-200 text-sm">
                                <!-- Data Pesanan -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 2: KELOLA MENU -->
            <div id="tab-menus" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 id="form-title" class="text-xl font-bold mb-4 text-gray-800">Tambah Menu Baru</h3>
                    <form id="menu-form" onsubmit="saveMenu(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="hidden" id="menu-id">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Menu</label>
                            <input type="text" id="menu-name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harga (Rp)</label>
                            <input type="number" id="menu-price" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">URL Gambar / Foto</label>
                            <input type="url" id="menu-image" placeholder="https://images.unsplash.com/..." required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Singkat</label>
                            <textarea id="menu-desc" rows="2" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
                        </div>
                        <div class="md:col-span-2 flex space-x-3">
                            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-2 rounded-lg font-medium transition">Simpan Menu</button>
                            <button type="button" onclick="resetMenuForm()" id="cancel-edit" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg font-medium hidden transition">Batal</button>
                        </div>
                    </form>
                </div>

                <!-- Daftar Menu Tabel -->
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-200">
                    <div class="p-4 border-b font-bold text-gray-800">Daftar Menu Saat Ini di Web</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">Gambar</th>
                                    <th class="p-4">Nama & Deskripsi</th>
                                    <th class="p-4">Harga</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="admin-menu-list" class="divide-y divide-gray-200 text-sm">
                                <!-- List Menu -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Admin Dashboard -->
    <script>
        function switchTab(tab) {
            const ordersTab = document.getElementById('tab-orders');
            const menusTab = document.getElementById('tab-menus');
            const btnOrders = document.getElementById('btn-tab-orders');
            const btnMenus = document.getElementById('btn-tab-menus');

            if (tab === 'orders') {
                ordersTab.classList.remove('hidden');
                menusTab.classList.add('hidden');
                btnOrders.className = "font-bold text-amber-700 border-b-2 border-amber-700 pb-2 px-2 transition";
                btnMenus.className = "font-bold text-gray-500 pb-2 px-2 transition";
                loadOrders();
            } else {
                ordersTab.classList.add('hidden');
                menusTab.classList.remove('hidden');
                btnMenus.className = "font-bold text-amber-700 border-b-2 border-amber-700 pb-2 px-2 transition";
                btnOrders.className = "font-bold text-gray-500 pb-2 px-2 transition";
                loadAdminMenus();
            }
        }

        // --- MANAJEMEN PESANAN ---
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('warung_orders')) || [];
            const tbody = document.getElementById('orders-table-body');
            document.getElementById('stat-orders').innerText = orders.length;

            let revenue = 0;
            orders.forEach(o => {
                if (o.status === 'Selesai') revenue += o.total;
            });
            document.getElementById('stat-revenue').innerText = `Rp ${revenue.toLocaleString('id-ID')}`;

            tbody.innerHTML = '';
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">Belum ada pesanan masuk.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                let itemsStr = ord.items.map(i => `${i.name} (${i.qty}x)`).join(', ');
                let statusColor = ord.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : (ord.status === 'Diproses' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800');

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-medium">${ord.id}<br><small class="text-gray-400">${ord.date}</small></td>
                        <td class="p-4 font-semibold text-gray-800">${ord.name}<br><small class="text-gray-500 font-normal"><i class="fa-solid fa-location-dot mr-1"></i>${ord.address}</small></td>
                        <td class="p-4 text-gray-600">${itemsStr}</td>
                        <td class="p-4 font-bold text-amber-700">Rp ${ord.total.toLocaleString('id-ID')}</td>
                        <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${statusColor}">${ord.status}</span></td>
                        <td class="p-4 text-center space-x-2">
                            <select onchange="updateOrderStatus(${index}, this.value)" class="border rounded px-2 py-1 text-xs">
                                <option value="Pending" ${ord.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Diproses" ${ord.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
                                <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                            </select>
                            <button onclick="deleteOrder(${index})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateOrderStatus(index, status) {
            let orders = JSON.parse(localStorage.getItem('warung_orders')) || [];
            orders[index].status = status;
            localStorage.setItem('warung_orders', JSON.stringify(orders));
            loadOrders();
        }

        function deleteOrder(index) {
            if (confirm('Hapus riwayat pesanan ini?')) {
                let orders = JSON.parse(localStorage.getItem('warung_orders')) || [];
                orders.splice(index, 1);
                localStorage.setItem('warung_orders', JSON.stringify(orders));
                loadOrders();
            }
        }

        function clearOrders() {
            if (confirm('Yakin ingin menghapus seluruh riwayat pesanan?')) {
                localStorage.removeItem('warung_orders');
                loadOrders();
            }
        }

        // --- MANAJEMEN MENU ---
        function loadAdminMenus() {
            const menuList = JSON.parse(localStorage.getItem('warung_menu')) || [];
            const tbody = document.getElementById('admin-menu-list');
            document.getElementById('stat-menus').innerText = menuList.length;

            tbody.innerHTML = '';
            menuList.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4"><img src="${item.image}" class="w-16 h-16 object-cover rounded-lg"></td>
                        <td class="p-4"><h5 class="font-bold text-gray-800">${item.name}</h5><p class="text-gray-500 text-xs">${item.desc}</p></td>
                        <td class="p-4 font-bold text-amber-700">Rp ${item.price.toLocaleString('id-ID')}</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="editMenu(${item.id})" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteMenu(${item.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function saveMenu(e) {
            e.preventDefault();
            const id = document.getElementById('menu-id').value;
            const name = document.getElementById('menu-name').value;
            const price = Number(document.getElementById('menu-price').value);
            const image = document.getElementById('menu-image').value;
            const desc = document.getElementById('menu-desc').value;

            let menuList = JSON.parse(localStorage.getItem('warung_menu')) || [];

            if (id) {
                // Edit
                let index = menuList.findIndex(m => m.id == id);
                if (index !== -1) {
                    menuList[index] = { id: Number(id), name, price, image, desc };
                }
            } else {
                // Tambah baru
                const newId = menuList.length > 0 ? Math.max(...menuList.map(m => m.id)) + 1 : 1;
                menuList.push({ id: newId, name, price, image, desc });
            }

            localStorage.setItem('warung_menu', JSON.stringify(menuList));
            resetMenuForm();
            loadAdminMenus();
            alert('Menu berhasil disimpan!');
        }

        function editMenu(id) {
            let menuList = JSON.parse(localStorage.getItem('warung_menu')) || [];
            let item = menuList.find(m => m.id === id);
            if (!item) return;

            document.getElementById('menu-id').value = item.id;
            document.getElementById('menu-name').value = item.name;
            document.getElementById('menu-price').value = item.price;
            document.getElementById('menu-image').value = item.image;
            document.getElementById('menu-desc').value = item.desc;

            document.getElementById('form-title').innerText = "Edit Menu";
            document.getElementById('cancel-edit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteMenu(id) {
            if (confirm('Yakin ingin menghapus menu ini?')) {
                let menuList = JSON.parse(localStorage.getItem('warung_menu')) || [];
                menuList = menuList.filter(m => m.id !== id);
                localStorage.setItem('warung_menu', JSON.stringify(menuList));
                loadAdminMenus();
            }
        }

        function resetMenuForm() {
            document.getElementById('menu-form').reset();
            document.getElementById('menu-id').value = '';
            document.getElementById('form-title').innerText = "Tambah Menu Baru";
            document.getElementById('cancel-edit').classList.add('hidden');
        }

        window.onload = loadOrders;
    </script>
</body>
</html>
