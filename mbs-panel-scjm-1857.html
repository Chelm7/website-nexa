<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Manajemen Resto - Mie Bangka Teladan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-sky-400">Panel Admin Resto</h2>
        <p class="text-xs text-slate-400">Mie Bangka Teladan Tanjungpinang</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400">Username</label>
          <input type="text" id="username" value="miebangka" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="text-xs text-slate-400">Password (Sandi: 123)</label>
          <input type="password" id="password" value="123" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>
        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded-lg text-sm transition">
          Masuk Panel
        </button>
      </form>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard" class="hidden max-w-2xl mx-auto p-4 space-y-6">
    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow">
      <div>
        <h1 class="font-bold text-sky-400 text-lg">Mie Bangka Teladan</h1>
        <p class="text-xs text-slate-400">Panel Manajemen Kasir & Dapur</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
          <span class="text-xs text-slate-400">Status:</span>
          <select id="status-toko-select" onchange="updateStatusToko(this.value)" class="bg-slate-900 text-xs text-white font-bold border border-slate-700 rounded px-2 py-1 focus:outline-none">
            <option value="open">Buka</option>
            <option value="closed">Tutup</option>
          </select>
        </div>
        <button onclick="logout()" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl hover:bg-red-600/40">Keluar</button>
      </div>
    </div>

    <!-- Live Orders Section -->
    <div class="space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-slate-200"><i class="fa-solid fa-list-check text-sky-400 mr-2"></i>Daftar Pesanan Masuk</h3>
        <button onclick="loadOrders()" class="text-xs bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
      </div>
      <div id="orders-container" class="space-y-3">
        <p class="text-center text-slate-500 text-xs py-8">Memuat daftar pesanan...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bshjfhjwfbdwtdqphjla.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-RoutcoL6TizW60mnEkB7Q_Hn7Zgy1Z";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById('username').value === 'miebangka' && document.getElementById('password').value === '123') {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        initDashboard();
      } else {
        alert('Username atau Password salah!');
      }
    }

    function logout() {
      document.getElementById('login-modal').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }

    async function initDashboard() {
      await loadStatusToko();
      await loadOrders();
      supabaseClient.channel('public:orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadOrders()).subscribe();
    }

    async function loadStatusToko() {
      const { data } = await supabaseClient.from('settings').select('*').eq('key', 'store_status').single();
      if (data) document.getElementById('status-toko-select').value = data.value;
    }

    async function updateStatusToko(val) {
      const { error } = await supabaseClient.from('settings').update({ value: val }).eq('key', 'store_status');
      if (error) alert('Gagal: ' + error.message);
      else alert('Status toko berhasil diubah!');
    }

    async function loadOrders() {
      const { data } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('orders-container');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 text-xs py-8">Belum ada pesanan masuk.</p>';
        return;
      }
      container.innerHTML = data.map(order => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow">
          <div class="flex justify-between items-start border-b border-slate-800 pb-2">
            <div>
              <span class="text-xs font-bold text-sky-400">ID: ${order.order_id || 'MB-' + order.id}</span>
              <h4 class="font-bold text-white text-sm mt-0.5">${order.customer_name} (${order.table_number})</h4>
            </div>
            <span class="text-[10px] uppercase font-extrabold px-2 py-1 rounded-md ${order.status === 'completed' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-sky-500/20 text-sky-400'}">${order.status}</span>
          </div>
          <div class="text-xs text-slate-300 space-y-1">
            <p><span class="text-slate-500">Catatan:</span> ${order.notes || '-'}</p>
            <p class="font-semibold text-slate-200 mt-2">Detail Pesanan:</p>
            <ul class="list-disc list-inside text-slate-400">
              ${(Array.isArray(order.items) ? order.items : []).map(i => `<li>${i.name} x${i.qty}</li>`).join('')}
            </ul>
          </div>
          <div class="flex justify-between items-center border-t border-slate-800 pt-3">
            <span class="font-bold text-sm text-emerald-400">Total: Rp ${Number(order.total_price || 0).toLocaleString('id-ID')}</span>
            <div class="flex gap-1.5">
              <button onclick="updateOrderStatus(${order.id}, 'processing')" class="text-xs bg-amber-600 text-white px-2.5 py-1 rounded-lg">Proses</button>
              <button onclick="updateOrderStatus(${order.id}, 'completed')" class="text-xs bg-emerald-600 text-white px-2.5 py-1 rounded-lg">Selesai</button>
              <button onclick="deleteOrder(${order.id})" class="text-xs bg-red-600/20 text-red-400 px-2 py-1 rounded-lg">Hapus</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function updateOrderStatus(id, newStatus) {
      await supabaseClient.from('orders').update({ status: newStatus }).eq('id', id);
      loadOrders();
    }

    async function deleteOrder(id) {
      if (confirm('Hapus pesanan ini?')) {
        await supabaseClient.from('orders').delete().eq('id', id);
        loadOrders();
      }
    }
  </script>
</body>
</html>
