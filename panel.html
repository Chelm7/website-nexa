<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Mie Bangka Teladan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: Arial, sans-serif; }
    </style>
</head>
<body class="bg-sky-50 text-slate-800 p-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-6 border border-sky-100 my-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-xl font-extrabold text-sky-950">Panel Admin Resto</h1>
                <p class="text-xs text-slate-500">Mie Bangka Teladan - Tanjungpinang</p>
            </div>
            <button onclick="muatPesanan()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>

        <div id="daftarPesanan" class="space-y-3">
            <p class="text-center text-gray-500 py-6 text-sm">Memuat data pesanan...</p>
        </div>
    </div>

    <script>
        async function muatPesanan() {
            const container = document.getElementById('daftarPesanan');
            container.innerHTML = '<p class="text-center text-gray-500 py-6 text-sm">Memuat data dari server...</p>';

            try {
                const response = await fetch('/api/pesanan');
                const data = await response.json();

                if (data.success && Array.isArray(data.pesanan) && data.pesanan.length > 0) {
                    let html = '';
                    data.pesanan.forEach(item => {
                        html += `
                            <div class="bg-sky-50 border border-sky-200 rounded-xl p-4 shadow-sm">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="font-extrabold text-sky-950 text-sm">👤 ${item.nama || 'Tanpa Nama'}</h4>
                                    <span class="text-[11px] text-sky-700 bg-white px-2 py-0.5 rounded border border-sky-200 font-semibold">${item.waktu || '-'}</span>
                                </div>
                                <p class="text-xs text-slate-700 mb-1"><strong>Menu:</strong> ${item.menu || '-'}</p>
                                <p class="text-xs text-slate-600"><strong>Catatan:</strong> ${item.catatan || 'Tidak ada'}</p>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p class="text-center text-gray-500 py-6 text-sm">Belum ada pesanan masuk.</p>';
                }
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500 py-6 text-sm">Gagal memuat pesanan: ${err.message}</p>`;
            }
        }

        // Muat pesanan saat halaman dibuka
        muatPesanan();
    </script>
</body>
</html>
