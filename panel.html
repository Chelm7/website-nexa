<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Pesanan Mie Bangka</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7
;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #991b1b
, #ef4444
);
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-box h1 {
      margin: 0 0 8px;
      color: #991b1b
;
    }

    .login-box p {
      color: #666;
      margin-bottom: 24px;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 4px;
    }

    .login-box input:focus {
      border-color: #dc2626
;
    }

    .btn {
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-primary {
      color: white;
      background: #dc2626
;
    }

    .btn-dark {
      color: white;
      background: #222;
    }

    .btn-green {
      color: white;
      background: #16a34a
;
    }

    .btn-orange {
      color: white;
      background: #ea580c
;
    }

    .btn-danger {
      color: white;
      background: #b91c1c
;
    }

    .btn-gray {
      color: #222;
      background: #e5e7eb
;
    }

    .error-message {
      color: #dc2626
;
      font-size: 14px;
      margin-top: 12px;
    }

    .admin-page {
      min-height: 100vh;
    }

    .topbar {
      background: #991b1b
;
      color: white;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .topbar h1 {
      font-size: 21px;
      margin: 0;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .container {
      width: min(1250px, 94%);
      margin: 25px auto;
    }

    .alert {
      padding: 13px 15px;
      border-radius: 9px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      color: #166534
;
      background: #dcfce7
;
    }

    .alert-error {
      color: #991b1b
;
      background: #fee2e2
;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .stat-card small {
      color: #666;
    }

    .stat-card strong {
      display: block;
      font-size: 28px;
      margin-top: 7px;
      color: #991b1b
;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .toolbar input,
    .toolbar select {
      flex: 1;
      min-width: 180px;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f9fafb
;
      color: #555;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    tr:hover td {
      background: #fffafa
;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-menunggu {
      color: #92400e
;
      background: #fef3c7
;
    }

    .status-diproses {
      color: #1e40af
;
      background: #dbeafe
;
    }

    .status-selesai {
      color: #166534
;
      background: #dcfce7
;
    }

    .status-dibatalkan {
      color: #991b1b
;
      background: #fee2e2
;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-buttons .btn {
      padding: 7px 9px;
      font-size: 12px;
    }

    .empty-state,
    .loading-state {
      padding: 45px 20px;
      text-align: center;
      color: #666;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 14px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 13px;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      margin: 0;
      color: #991b1b
;
      font-size: 20px;
    }

    .close-btn {
      background: transparent;
      color: #666;
      font-size: 25px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0
;
    }

    .detail-row strong {
      color: #555;
    }

    .detail-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-card strong {
        font-size: 22px;
      }

      .container {
        width: 96%;
      }

      .detail-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HALAMAN LOGIN
       ========================= -->
  <section id="loginPage" class="login-page">
    <div class="login-box">
      <h1>Admin Mie Bangka</h1>
      <p>Masukkan PIN admin untuk melihat pesanan</p>

      <form id="loginForm">
        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          maxlength="20"
          placeholder="PIN Admin"
          autocomplete="off"
          required
        />

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Masuk
        </button>
      </form>

      <div id="loginError" class="error-message"></div>
    </div>
  </section>

  <!-- =========================
       DASHBOARD ADMIN
       ========================= -->
  <section id="adminPage" class="admin-page hidden">
    <header class="topbar">
      <h1>Dashboard Pesanan Mie Bangka</h1>

      <div class="topbar-actions">
        <button id="refreshButton" class="btn btn-green">
          Refresh
        </button>

        <button id="logoutButton" class="btn btn-dark">
          Keluar
        </button>
      </div>
    </header>

    <main class="container">
      <div id="alertBox" class="alert"></div>

      <section class="stats">
        <div class="stat-card">
          <small>Total Pesanan</small>
          <strong id="totalOrders">0</strong>
        </div>

        <div class="stat-card">
          <small>Menunggu</small>
          <strong id="waitingOrders">0</strong>
        </div>

        <div class="stat-card">
          <small>Diproses</small>
          <strong id="processingOrders">0</strong>
        </div>

        <div class="stat-card">
          <small>Selesai</small>
          <strong id="completedOrders">0</strong>
        </div>
      </section>

      <section class="toolbar">
        <input
          id="searchInput"
          type="search"
          placeholder="Cari nama, nomor telepon, atau alamat..."
        />

        <select id="statusFilter">
          <option value="">Semua Status</option>
          <option value="Menunggu">Menunggu</option>
          <option value="Diproses">Diproses</option>
          <option value="Selesai">Selesai</option>
          <option value="Dibatalkan">Dibatalkan</option>
        </select>

        <button id="clearFilterButton" class="btn btn-gray">
          Hapus Filter
        </button>
      </section>

      <section class="table-box">
        <div id="loadingState" class="loading-state">
          Memuat pesanan...
        </div>

        <div id="emptyState" class="empty-state hidden">
          Belum ada pesanan.
        </div>

        <table id="ordersTable" class="hidden">
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Telepon</th>
              <th>Pesanan</th>
              <th>Total</th>
              <th>Pembayaran</th>
              <th>Status</th>
              <th>Tanggal</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="ordersBody"></tbody>
        </table>
      </section>
    </main>
  </section>

  <!-- =========================
       MODAL DETAIL PESANAN
       ========================= -->
  <div id="detailModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Detail Pesanan</h2>
        <button id="closeModalButton" class="close-btn">&times;</button>
      </div>

      <div id="detailContent"></div>

      <div class="detail-actions">
        <button id="closeModalButtonBottom" class="btn btn-gray">
          Tutup
        </button>
      </div>
    </div>
  </div>

  <script>
    /*
      ============================================================
      PENGATURAN UTAMA
      ============================================================

      1. Ganti SHEETDB_URL dengan URL SheetDB milik kamu.
      2. Ganti ADMIN_PIN jika ingin mengubah PIN.
      3. Nama tabel SheetDB tidak ditulis di sini karena URL SheetDB
         langsung mengarah ke database kamu.
    */

    const CONFIG = {
      SHEETDB_URL: "https://sheetdb.io/api/v1/GANTI_DENGAN_ID_SHEETDB",

      // PIN ini hanya untuk akses dasar pada halaman browser.
      // Untuk keamanan tingkat tinggi, gunakan backend/server.
      ADMIN_PIN: "886886",

      // Nama kolom unik untuk update dan hapus data.
      // Pastikan SheetDB memiliki kolom "id" unik.
      ROW_KEY_COLUMN: "id"
    };

    let allOrders = [];
    let selectedOrder = null;

    const loginPage = document.getElementById("loginPage");
    const adminPage = document.getElementById("adminPage");
    const loginForm = document.getElementById("loginForm");
    const pinInput = document.getElementById("pinInput");
    const loginError = document.getElementById("loginError");

    const refreshButton = document.getElementById("refreshButton");
    const logoutButton = document.getElementById("logoutButton");

    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const clearFilterButton = document.getElementById("clearFilterButton");

    const loadingState = document.getElementById("loadingState");
    const emptyState = document.getElementById("emptyState");
    const ordersTable = document.getElementById("ordersTable");
    const ordersBody = document.getElementById("ordersBody");

    const detailModal = document.getElementById("detailModal");
    const detailContent = document.getElementById("detailContent");
    const closeModalButton = document.getElementById("closeModalButton");
    const closeModalButtonBottom = document.getElementById("closeModalButtonBottom");

    const alertBox = document.getElementById("alertBox");

    /*
      =========================
      HELPER
      =========================
    */

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatRupiah(value) {
      if (value === null || value === undefined || value === "") {
        return "-";
      }

      const number = Number(
        String(value)
          .replace(/[^\d.-]/g, "")
          .replace(/\./g, "")
      );

      if (Number.isNaN(number)) {
        return escapeHTML(value);
      }

      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(number);
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleString("id-ID", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function showAlert(message, type = "success") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;

      setTimeout(() => {
        alertBox.classList.remove("show");
      }, 4000);
    }

    function getValue(order, possibleKeys) {
      for (const key of possibleKeys) {
        if (
          order[key] !== undefined &&
          order[key] !== null &&
          order[key] !== ""
        ) {
          return order[key];
        }
      }

      return "";
    }

    function getOrderId(order) {
      return order[CONFIG.ROW_KEY_COLUMN] || "";
    }

    function getOrderName(order) {
      return getValue(order, ["nama", "name", "customer_name", "pelanggan"]);
    }

    function getOrderPhone(order) {
      return getValue(order, ["telepon", "phone", "no_hp", "nomor_hp"]);
    }

    function getOrderAddress(order) {
      return getValue(order, ["alamat", "address"]);
    }

    function getOrderItems(order) {
      return getValue(order, [
        "items",
        "pesanan",
        "detail_pesanan",
        "produk",
        "menu"
      ]);
    }

    function getOrderTotal(order) {
      return getValue(order, ["total", "harga_total", "grand_total"]);
    }

    function getOrderPayment(order) {
      return getValue(order, [
        "payment",
        "pembayaran",
        "metode_pembayaran"
      ]);
    }

    function getOrderStatus(order) {
      return getValue(order, ["status", "Status"]) || "Menunggu";
    }

    function getOrderDate(order) {
      return getValue(order, [
        "created_at",
        "tanggal",
        "waktu",
        "date",
        "timestamp"
      ]);
    }

    function getStatusClass(status) {
      const value = String(status).toLowerCase();

      if (value.includes("proses")) return "status-diproses";
      if (value.includes("selesai")) return "status-selesai";
      if (
        value.includes("batal") ||
        value.includes("cancel")
      ) {
        return "status-dibatalkan";
      }

      return "status-menunggu";
    }

    function formatItems(items) {
      if (!items) return "-";

      if (typeof items === "object") {
        return JSON.stringify(items);
      }

      try {
        const parsed = JSON.parse(items);

        if (Array.isArray(parsed)) {
          return parsed
            .map(item => {
              if (typeof item === "string") return item;

              const name =
                item.nama ||
                item.name ||
                item.menu ||
                item.produk ||
                "Menu";

              const qty =
                item.jumlah ||
                item.qty ||
                item.quantity ||
                1;

              return `${name} x${qty}`;
            })
            .join(", ");
        }

        return JSON.stringify(parsed);
      } catch {
        return String(items);
      }
    }

    /*
      =========================
      LOGIN
      =========================
    */

    function showAdminPage() {
      loginPage.classList.add("hidden");
      adminPage.classList.remove("hidden");
      loadOrders();
    }

    function showLoginPage() {
      adminPage.classList.add("hidden");
      loginPage.classList.remove("hidden");
      pinInput.value = "";
      pinInput.focus();
    }

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      if (pinInput.value === CONFIG.ADMIN_PIN) {
        sessionStorage.setItem("mieBangkaAdminLogin", "true");
        loginError.textContent = "";
        showAdminPage();
      } else {
        loginError.textContent = "PIN admin salah.";
        pinInput.value = "";
        pinInput.focus();
      }
    });

    logoutButton.addEventListener("click", function() {
      sessionStorage.removeItem("mieBangkaAdminLogin");
      showLoginPage();
    });

    /*
      =========================
      AMBIL DATA SHEETDB
      =========================
    */

    async function loadOrders() {
      loadingState.classList.remove("hidden");
      emptyState.classList.add("hidden");
      ordersTable.classList.add("hidden");

      try {
        if (
          !CONFIG.SHEETDB_URL ||
          CONFIG.SHEETDB_URL.includes("GANTI_DENGAN_ID")
        ) {
          throw new Error("URL SheetDB belum diganti.");
        }

        const response = await fetch(CONFIG.SHEETDB_URL, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`Server SheetDB error: ${response.status}`);
        }

        const data = await response.json();

        allOrders = Array.isArray(data)
          ? data
          : Array.isArray(data.data)
            ? data.data
            : [];

        renderOrders(allOrders);
        updateStats(allOrders);
      } catch (error) {
        allOrders = [];
        renderOrders([]);
        showAlert(error.message || "Gagal mengambil data pesanan.", "error");
      } finally {
        loadingState.classList.add("hidden");
      }
    }

    /*
      =========================
      TAMPILKAN DATA
      =========================
    */

    function renderOrders(orders) {
      ordersBody.innerHTML = "";

      if (!orders.length) {
        emptyState.classList.remove("hidden");
        ordersTable.classList.add("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      ordersTable.classList.remove("hidden");

      orders.forEach((order, index) => {
        const orderId = getOrderId(order);
        const name = getOrderName(order);
        const phone = getOrderPhone(order);
        const items = formatItems(getOrderItems(order));
        const total = getOrderTotal(order);
        const payment = getOrderPayment(order);
        const status = getOrderStatus(order);
        const date = getOrderDate(order);

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${index + 1}</td>

          <td>
            <strong>${escapeHTML(name || "Tanpa Nama")}</strong>
            ${
              orderId
                ? `<br><small>ID: ${escapeHTML(orderId)}</small>`
                : ""
            }
          </td>

          <td>${escapeHTML(phone || "-")}</td>

          <td>${escapeHTML(items)}</td>

          <td>${formatRupiah(total)}</td>

          <td>${escapeHTML(payment || "-")}</td>

          <td>
            <span class="status ${getStatusClass(status)}">
              ${escapeHTML(status)}
            </span>
          </td>

          <td>${formatDate(date)}</td>

          <td>
            <div class="action-buttons">
              <button class="btn btn-gray detail-btn">
                Detail
              </button>

              <button class="btn btn-orange status-btn">
                Status
              </button>

              <button class="btn btn-danger delete-btn">
                Hapus
              </button>
            </div>
          </td>
        `;

        row.querySelector(".detail-btn")
          .addEventListener("click", () => openDetail(order));

        row.querySelector(".status-btn")
          .addEventListener("click", () => changeStatus(order));

        row.querySelector(".delete-btn")
          .addEventListener("click", () => deleteOrder(order));

        ordersBody.appendChild(row);
      });
    }

    function updateStats(orders) {
      document.getElementById("totalOrders").textContent = orders.length;

      document.getElementById("waitingOrders").textContent =
        orders.filter(order =>
          getOrderStatus(order)
            .toLowerCase()
            .includes("menunggu")
        ).length;

      document.getElementById("processingOrders").textContent =
        orders.filter(order =>
          getOrderStatus(order)
            .toLowerCase()
            .includes("proses")
        ).length;

      document.getElementById("completedOrders").textContent =
        orders.filter(order =>
          getOrderStatus(order)
            .toLowerCase()
            .includes("selesai")
        ).length;
    }

    /*
      =========================
      FILTER DAN PENCARIAN
      =========================
    */

    function applyFilters() {
      const search = searchInput.value.toLowerCase().trim();
      const selectedStatus = statusFilter.value.toLowerCase();

      const filtered = allOrders.filter(order => {
        const searchableText = [
          getOrderName(order),
          getOrderPhone(order),
          getOrderAddress(order),
          getOrderItems(order),
          getOrderTotal(order),
          getOrderPayment(order),
          getOrderStatus(order)
        ]
          .join(" ")
          .toLowerCase();

        const matchSearch =
          !search || searchableText.includes(search);

        const matchStatus =
          !selectedStatus ||
          getOrderStatus(order).toLowerCase() === selectedStatus;

        return matchSearch && matchStatus;
      });

      renderOrders(filtered);
    }

    searchInput.addEventListener("input", applyFilters);
    statusFilter.addEventListener("change", applyFilters);

    clearFilterButton.addEventListener("click", function() {
      searchInput.value = "";
      statusFilter.value = "";
      renderOrders(allOrders);
    });

    refreshButton.addEventListener("click", loadOrders);

    /*
      =========================
      DETAIL PESANAN
      =========================
    */

    function openDetail(order) {
      selectedOrder = order;

      const items = formatItems(getOrderItems(order));

      detailContent.innerHTML = `
        <div class="detail-row">
          <strong>ID Pesanan</strong>
          <span>${escapeHTML(getOrderId(order) || "-")}</span>
        </div>

        <div class="detail-row">
          <strong>Nama</strong>
          <span>${escapeHTML(getOrderName(order) || "-")}</span>
        </div>

        <div class="detail-row">
          <strong>Telepon</strong>
          <span>${escapeHTML(getOrderPhone(order) || "-")}</span>
        </div>

        <div class="detail-row">
          <strong>Alamat</strong>
          <span>${escapeHTML(getOrderAddress(order) || "-")}</span>
        </div>

        <div class="detail-row">
          <strong>Pesanan</strong>
          <span>${escapeHTML(items)}</span>
        </div>

        <div class="detail-row">
          <strong>Total</strong>
          <span>${formatRupiah(getOrderTotal(order))}</span>
        </div>

        <div class="detail-row">
          <strong>Pembayaran</strong>
          <span>${escapeHTML(getOrderPayment(order) || "-")}</span>
        </div>

        <div class="detail-row">
          <strong>Status</strong>
          <span>${escapeHTML(getOrderStatus(order))}</span>
        </div>

        <div class="detail-row">
          <strong>Waktu</strong>
          <span>${formatDate(getOrderDate(order))}</span>
        </div>
      `;

      detailModal.classList.remove("hidden");
    }

    function closeDetail() {
      detailModal.classList.add("hidden");
      selectedOrder = null;
    }

    closeModalButton.addEventListener("click", closeDetail);
    closeModalButtonBottom.addEventListener("click", closeDetail);

    detailModal.addEventListener("click", function(event) {
      if (event.target === detailModal) {
        closeDetail();
      }
    });

    /*
      =========================
      UBAH STATUS PESANAN
      =========================

      SheetDB membutuhkan kolom unik, biasanya "id".
      Contoh URL PATCH:
      https://sheetdb.io/api/v1/ID_SHEETDB/id/123
    */

    async function changeStatus(order) {
      const orderId = getOrderId(order);

      if (!orderId) {
        showAlert(
          "Pesanan ini tidak memiliki ID unik. Tambahkan kolom id di SheetDB.",
          "error"
        );
        return;
      }

      const currentStatus = getOrderStatus(order);

      const newStatus = prompt(
        "Masukkan status baru:\nMenunggu, Diproses, Selesai, atau Dibatalkan",
        currentStatus
      );

      if (!newStatus) return;

      const allowedStatuses = [
        "Menunggu",
        "Diproses",
        "Selesai",
        "Dibatalkan"
      ];

      const normalizedStatus = allowedStatuses.find(
        status => status.toLowerCase() === newStatus.toLowerCase()
      );

      if (!normalizedStatus) {
        showAlert(
          "Status harus Menunggu, Diproses, Selesai, atau Dibatalkan.",
          "error"
        );
        return;
      }

      try {
        const updateUrl =
          `${CONFIG.SHEETDB_URL}/${CONFIG.ROW_KEY_COLUMN}/${encodeURIComponent(orderId)}`;

        const response = await fetch(updateUrl, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            data: {
              status: normalizedStatus
            }
          })
        });

        if (!response.ok) {
          throw new Error(`Gagal mengubah status: ${response.status}`);
        }

        showAlert("Status pesanan berhasil diubah.");
        await loadOrders();
      } catch (error) {
        showAlert(
          error.message || "Gagal mengubah status pesanan.",
          "error"
        );
      }
    }

    /*
      =========================
      HAPUS PESANAN
      =========================
    */

    async function deleteOrder(order) {
      const orderId = getOrderId(order);

      if (!orderId) {
        showAlert(
          "Pesanan ini tidak memiliki ID unik. Tambahkan kolom id di SheetDB.",
          "error"
        );
        return;
      }

      const name = getOrderName(order) || "pesanan ini";

      const confirmed = confirm(
        `Hapus ${name}? Data yang sudah dihapus tidak dapat dikembalikan.`
      );

      if (!confirmed) return;

      try {
        const deleteUrl =
          `${CONFIG.SHEETDB_URL}/${CONFIG.ROW_KEY_COLUMN}/${encodeURIComponent(orderId)}`;

        const response = await fetch(deleteUrl, {
          method: "DELETE",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`Gagal menghapus pesanan: ${response.status}`);
        }

        showAlert("Pesanan berhasil dihapus.");
        await loadOrders();
      } catch (error) {
        showAlert(
          error.message || "Gagal menghapus pesanan.",
          "error"
        );
      }
    }

    /*
      =========================
      SAAT HALAMAN DIBUKA
      =========================
    */

    if (sessionStorage.getItem("mieBangkaAdminLogin") === "true") {
      showAdminPage();
    } else {
      showLoginPage();
    }
  </script>
</body>
</html>
