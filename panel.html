<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Panel Resto - Mie Bangka Teladan</title> 
    <!-- Tailwind CSS --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    
    <script> 
        let lastOrderCount = 0;
        let audioCtx = null;

        function checkAdminAuth() { 
            if (sessionStorage.getItem('mb_admin_logged') !== 'true') { 
                document.getElementById('login-modal').classList.remove('hidden'); 
            } else { 
                document.getElementById('login-modal').classList.add('hidden'); 
                initAdminPanel(); 
            } 
        } 

        function verifyAdminLogin() { 
            let usernameInput = document.getElementById('admin-username').value.trim(); 
            let passwordInput = document.getElementById('admin-password').value.trim(); 
            let pinInput = document.getElementById('admin-pin').value.trim(); 
            
            let correctUsername = "miebangka"; 
            let correctPassword = "admin123"; 
            let correctPin = "886886"; 
            
            if (usernameInput !== correctUsername || passwordInput !== correctPassword) { 
                alert('Nama Resto atau Sandi salah.'); 
                return; 
            } 
            if (pinInput !== correctPin) { 
                alert('PIN Rahasia Resto salah.'); 
                return; 
            } 
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {
                console.log("AudioContext init error:", e);
            }

            sessionStorage.setItem('mb_admin_logged', 'true'); 
            alert('Masuk Panel Resto Berhasil.'); 
            document.getElementById('login-modal').classList.add('hidden'); 
            initAdminPanel(); 
        } 

        function logoutAdmin() {
            sessionStorage.removeItem('mb_admin_logged');
            location.reload();
        }

        function toggleVisibility(fieldId, iconId) { 
            const field = document.getElementById(fieldId); 
            const icon = document.getElementById(iconId); 
            if (field.type === 'password') { 
                field.type = 'text'; 
                icon.className = 'fa-solid fa-eye-slash text-gray-500'; 
            } else { 
                field.type = 'password'; 
                icon.className = 'fa-solid fa-eye text-gray-500'; 
            } 
        } 

        function switchTab(tabName) {
            const tabs = ['orders', 'menus', 'banners', 'banks', 'settings'];
            tabs.forEach(t => {
                let sec = document.getElementById(`section-${t}`);
                let btn = document.getElementById(`tab-btn-${t}`);
                if(sec) sec.classList.add('hidden');
                if(btn) btn.className = "text-sky-200 hover:text-white pb-1";
            });
            let targetSec = document.getElementById(`section-${tabName}`);
            let targetBtn = document.getElementById(`tab-btn-${tabName}`);
            if(targetSec) targetSec.classList.remove('hidden');
            if(targetBtn) targetBtn.className = "font-bold border-b-2 border-white pb-1";
        }

        function initAdminPanel() {
            let status = localStorage.getItem('mb_resto_status') || 'Buka';
            let statusSelect = document.getElementById('header-resto-status');
            if(statusSelect) statusSelect.value = status;
            
            let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
            lastOrderCount = orders.length; 
            
            renderOrders();
            setInterval(checkForNewOrders, 3000); 
            
            if(typeof renderMenus === 'function') renderMenus();
            if(typeof renderBanners === 'function') renderBanners();
            if(typeof renderBanks === 'function') renderBanks();
            if(typeof renderSettings === 'function') renderSettings();
        }

        function playAdminSound() {
            let soundEnabled = localStorage.getItem('mb_sound_enabled') !== 'false';
            if(!soundEnabled) return;

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                let now = audioCtx.currentTime;
                let osc1 = audioCtx.createOscillator();
                let gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now); 
                gain1.gain.setValueAtTime(0.2, now);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.3);

            } catch(e) {
                console.log("Audio play failed:", e);
            }
        }

        function checkForNewOrders() {
            let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
            if (orders.length > lastOrderCount) {
                if (lastOrderCount !== 0) {
                    playAdminSound();
                }
                lastOrderCount = orders.length;
                renderOrders();
            }
        }

        function changeRestoStatus(val) {
            localStorage.setItem('mb_resto_status', val);
            alert('Status resto diubah menjadi: ' + val);
        }

        function clearOrders() {
            if (confirm('Yakin ingin menghapus semua riwayat pesanan?')) {
                localStorage.removeItem('mb_orders');
                lastOrderCount = 0;
                renderOrders();
            }
        }

        function deleteSingleOrder(index) {
            if (confirm('Hapus pesanan ini dari riwayat?')) {
                let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
                let realIndex = orders.length - 1 - index;
                orders.splice(realIndex, 1);
                localStorage.setItem('mb_orders', JSON.stringify(orders));
                lastOrderCount = orders.length;
                renderOrders();
            }
        }

        let currentFilter = 'Semua';
        function filterOrders(status) {
            currentFilter = status;
            renderOrders();
        }

        function renderOrders() {
            let ordersContainer = document.getElementById('orders-list-container');
            if(!ordersContainer) return;
            let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
            lastOrderCount = orders.length;
            
            if (orders.length === 0) {
                ordersContainer.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-500">Belum ada pesanan masuk.</div>`;
                return;
            }

            let sortedOrders = orders.slice().sort((a, b) => {
                let timeA = Number(a.id) || 0;
                let timeB = Number(b.id) || 0;
                return timeB - timeA;
            });

            let filteredOrders = sortedOrders.filter(order => {
                if (currentFilter === 'Semua') return true;
                if (currentFilter === 'Menunggu') return (order.status === 'Menunggu' || order.status === 'Pending' || order.status === 'Menunggu Verifikasi Resto' || !order.status);
                if (currentFilter === 'Diproses') return order.status === 'Diproses';
                if (currentFilter === 'Selesai') return order.status === 'Selesai';
                return true;
            });

            if (filteredOrders.length === 0) {
                ordersContainer.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-500">Tidak ada pesanan dengan filter "${currentFilter}".</div>`;
                return;
            }

            let html = '<div class="space-y-4">';
            filteredOrders.forEach((order, idx) => {
                let originalIdx = orders.findIndex(o => o.id === order.id);
                if(originalIdx === -1) originalIdx = idx;

                let statusBadge = order.status || 'Menunggu';
                let badgeClass = 'bg-yellow-100 text-yellow-800';
                if(statusBadge === 'Diproses') badgeClass = 'bg-blue-100 text-blue-800';
                if(statusBadge === 'Selesai') badgeClass = 'bg-green-100 text-green-800';
                if(statusBadge === 'Dibatalkan') badgeClass = 'bg-red-100 text-red-800';

                let isPending = (statusBadge === 'Menunggu' || statusBadge === 'Pending' || statusBadge === 'Menunggu Verifikasi Resto' || !order.status);
                let isProcessing = (statusBadge === 'Diproses');

                let cardStyle = 'bg-white border shadow-sm';
                if (isPending) {
                    cardStyle = 'bg-blue-50/90 border-2 border-blue-500 shadow-[0_0_20px_rgba(0,149,255,0.9)]';
                } else if (isProcessing) {
                    cardStyle = 'bg-emerald-50/90 border-2 border-emerald-500 shadow-[0_0_20px_rgba(0,255,127,0.9)]';
                }

                let itemsList = '';
                if(order.items && Array.isArray(order.items)) {
                    itemsList = order.items.map(i => `<p class="text-xs text-gray-700">- ${i.name} (${i.qty}x) Rp ${(i.price * i.qty).toLocaleString('id-ID')}</p>`).join('');
                }

                html += `
                    <div class="${cardStyle} p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded text-xs">#${order.id || (idx+1)}</span>
                                <span class="text-xs text-gray-500">${order.date || 'Hari ini'}</span>
                                <span class="${badgeClass} px-2 py-0.5 rounded text-xs font-bold">${statusBadge}</span>
                            </div>
                            <h4 class="font-bold text-gray-800">${order.name} (${order.phone || '-'})</h4>
                            <p class="text-xs text-gray-600 mb-1">${order.address}</p>
                            <div class="bg-white/80 p-2 rounded mb-1 border">${itemsList || '<p class="text-xs text-gray-500">Catatan: '+(order.note||'-')+'</p>'}</div>
                            <p class="text-xs font-semibold text-sky-700">Total: Rp ${Number(order.total).toLocaleString('id-ID')} (${order.payment || 'Tunai/Transfer'})</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="updateOrderStatus(${originalIdx}, 'Diproses')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Proses</button>
                            <button onclick="updateOrderStatus(${originalIdx}, 'Selesai')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Selesai</button>
                            <button onclick="printBluetoothOrder(${originalIdx})" class="bg-sky-500 hover:bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold"><i class="fa-solid fa-print mr-1"></i> Cetak</button>
                            <button onclick="updateOrderStatus(${originalIdx}, 'Dibatalkan')" class="bg-orange-500 hover:bg-orange-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Tolak</button>
                            <button onclick="deleteSingleOrder(${originalIdx})" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-3 py-1.5 rounded-lg font-bold">Hapus</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            ordersContainer.innerHTML = html;
        }

        function updateOrderStatus(index, status) {
            let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
            if(orders[index]) {
                orders[index].status = status;
                localStorage.setItem('mb_orders', JSON.stringify(orders));
                renderOrders();
            }
        }

        async function printBluetoothOrder(index) {
            let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
            let o = orders[index];
            if (!o) return;

            if (!navigator.bluetooth) {
                alert('Browser Anda tidak mendukung Web Bluetooth. Gunakan Google Chrome di HP Android.');
                return;
            }

            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000ff00-0000-1000-8000-00805f9b34fb']
                });

                const server = await device.gatt.connect();
                const services = await server.getPrimaryServices();
                let characteristic = null;

                for (let service of services) {
                    const chars = await service.getCharacteristics();
                    for (let char of chars) {
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            characteristic = char;
                            break;
                        }
                    }
                    if (characteristic) break;
                }

                if (!characteristic) {
                    alert('Tidak dapat menemukan jalur cetak pada printer Bluetooth ini.');
                    return;
                }

                let encoder = new TextEncoder();
                let printData = "\x1B\x40"; 
                printData += "\x1B\x61\x01"; 
                printData += "MIE BANGKA TELADAN\n";
                printData += "Jalan Batu 8 Atas, Kota Tanjungpinang\n";
                printData += "WA: 081267166886 / 082384039200\n";
                printData += "--------------------------------\n";
                printData += "\x1B\x61\x00"; 
                printData += `No Pesanan : #${o.id || (index+1)}\n`;
                printData += `Tanggal    : ${o.date || 'Hari ini'}\n`;
                printData += `Pelanggan  : ${o.name} (${o.phone || '-'})\n`;
                printData += `Alamat     : ${o.address}\n`;
                printData += "--------------------------------\n";
                printData += "DETAIL PESANAN (Topping B2 Non-Halal):\n";
                
                if(o.items && Array.isArray(o.items)) {
                    o.items.forEach(i => {
                        printData += `${i.name} x${i.qty} : Rp ${(i.price * i.qty).toLocaleString('id-ID')}\n`;
                    });
                } else {
                    printData += `${o.note || 'Pesanan Resto'}\n`;
                }

                printData += "--------------------------------\n";
                printData += `TOTAL: Rp ${Number(o.total).toLocaleString('id-ID')}\n`;
                printData += `Pembayaran: ${o.payment || 'Tunai'}\n`;
                printData += "--------------------------------\n";
                printData += "\x1B\x61\x01"; 
                printData += "Terima Kasih Atas Kunjungan Anda\n\n\n";

                await characteristic.writeValue(encoder.encode(printData));
                alert('Struk berhasil dicetak via Bluetooth!');
            } catch (error) {
                console.error(error);
                alert('Gagal mencetak: ' + error.message);
            }
        }

        let menuImageBase64 = "";

        function previewMenuImageFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    menuImageBase64 = e.target.result;
                    document.getElementById('menu-img-preview').src = menuImageBase64;
                    document.getElementById('menu-img-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function renderMenus() {
            let container = document.getElementById('menu-list-container');
            if(!container) return;
            let menus = JSON.parse(localStorage.getItem('mb_menus') || '[]');
            if (menus.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-500">Belum ada menu terdaftar. Tambahkan menu baru di atas.</div>`;
                return;
            }
            let html = '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">';
            menus.forEach((m, idx) => {
                let imgUrl = m.image || 'https://via.placeholder.com/400x300?text=No+Image';
                html += `
                    <div class="bg-white p-4 rounded-xl shadow flex flex-col justify-between border">
                        <div>
                            <img src="${imgUrl}" class="w-full h-32 object-cover rounded-lg mb-3 border">
                            <span class="text-[10px] font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full">${m.category || 'Makanan'}</span>
                            <h4 class="font-bold text-gray-800 mt-1">${m.name}</h4>
                            <p class="text-xs text-sky-700 font-bold mb-1">Rp ${Number(m.price).toLocaleString('id-ID')}</p>
                            <p class="text-xs text-gray-600">${m.desc || '-'}</p>
                        </div>
                        <div class="mt-4 flex justify-end gap-2">
                            <button onclick="deleteMenu(${idx})" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded text-xs font-bold">Hapus</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function addMenu(e) {
            e.preventDefault();
            let name = document.getElementById('menu-name').value;
            let price = document.getElementById('menu-price').value;
            let desc = document.getElementById('menu-desc').value;
            let category = document.getElementById('menu-category').value;
            let urlInput = document.getElementById('menu-image-url').value.trim();
            
            let finalImage = menuImageBase64 || urlInput || "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=500&q=80";

            let menus = JSON.parse(localStorage.getItem('mb_menus') || '[]');
            menus.push({ 
                id: Date.now(),
                name, 
                price: Number(price), 
                desc, 
                category,
                image: finalImage 
            });
            localStorage.setItem('mb_menus', JSON.stringify(menus));
            
            menuImageBase64 = "";
            document.getElementById('form-add-menu').reset();
            document.getElementById('menu-img-preview-container').classList.add('hidden');
            renderMenus();
            alert('Menu berhasil ditambahkan!');
        }

        function deleteMenu(index) {
            if (confirm('Hapus menu ini?')) {
                let menus = JSON.parse(localStorage.getItem('mb_menus') || '[]');
                menus.splice(index, 1);
                localStorage.setItem('mb_menus', JSON.stringify(menus));
                renderMenus();
            }
        }

        function renderBanners() {
            let container = document.getElementById('banner-list-container');
            if(!container) return;
            let banners = JSON.parse(localStorage.getItem('mb_banners') || '[]');
            if (banners.length === 0) {
                container.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-gray-500 text-xs">Belum ada banner aktif.</div>`;
                return;
            }
            let html = '<div class="space-y-2">';
            banners.forEach((b, idx) => {
                html += `
                    <div class="bg-white p-3 rounded-lg border flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-sky-700">${b.title || 'Banner'}</span>
                            <p class="text-gray-500 truncate max-w-xs">${b.image}</p>
                        </div>
                        <button onclick="deleteBanner(${idx})" class="bg-red-100 text-red-700 px-2 py-1 rounded font-bold">Hapus</button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function addBanner(e) {
            e.preventDefault();
            let title = document.getElementById('banner-title').value;
            let image = document.getElementById('banner-image').value;
            let banners = JSON.parse(localStorage.getItem('mb_banners') || '[]');
            banners.push({ title, image });
            localStorage.setItem('mb_banners', JSON.stringify(banners));
            document.getElementById('form-add-banner').reset();
            renderBanners();
            alert('Banner ditambahkan!');
        }

        function deleteBanner(index) {
            let banners = JSON.parse(localStorage.getItem('mb_banners') || '[]');
            banners.splice(index, 1);
            localStorage.setItem('mb_banners', JSON.stringify(banners));
            renderBanners();
        }

        function renderBanks() {
            let container = document.getElementById('bank-list-container');
            if(!container) return;
            let banks = JSON.parse(localStorage.getItem('mb_banks') || '[]');
            if (banks.length === 0) {
                container.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-gray-500 text-xs">Belum ada rekening terdaftar.</div>`;
                return;
            }
            let html = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">';
            banks.forEach((b, idx) => {
                html += `
                    <div class="bg-white p-3 rounded-lg border flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-gray-800">${b.bankName} - ${b.accNum}</span>
                            <p class="text-gray-500">A/N ${b.accName}</p>
                        </div>
                        <button onclick="deleteBank(${idx})" class="bg-red-100 text-red-700 px-2 py-1 rounded font-bold">Hapus</button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function addBank(e) {
            e.preventDefault();
            let bankName = document.getElementById('bank-name').value;
            let accNum = document.getElementById('bank-accnum').value;
            let accName = document.getElementById('bank-accname').value;
            let banks = JSON.parse(localStorage.getItem('mb_banks') || '[]');
            banks.push({ bankName, accNum, accName });
            localStorage.setItem('mb_banks', JSON.stringify(banks));
            document.getElementById('form-add-bank').reset();
            renderBanks();
            alert('Rekening ditambahkan!');
        }

        function deleteBank(index) {
            let banks = JSON.parse(localStorage.getItem('mb_banks') || '[]');
            banks.splice(index, 1);
            localStorage.setItem('mb_banks', JSON.stringify(banks));
            renderBanks();
        }

        function renderSettings() {
            let wa = localStorage.getItem('mb_admin_wa') || '081267166886';
            let fee = localStorage.getItem('mb_delivery_fee') || '0';
            let sound = localStorage.getItem('mb_sound_enabled') !== 'false';
            
            if(document.getElementById('setting-wa')) document.getElementById('setting-wa').value = wa;
            if(document.getElementById('setting-fee')) document.getElementById('setting-fee').value = fee;
            if(document.getElementById('setting-sound')) document.getElementById('setting-sound').checked = sound;
        }

        function saveSettings(e) {
            e.preventDefault();
            let wa = document.getElementById('setting-wa').value;
            let fee = document.getElementById('setting-fee').value;
            let sound = document.getElementById('setting-sound').checked;
            
            localStorage.setItem('mb_admin_wa', wa);
            localStorage.setItem('mb_delivery_fee', fee);
            localStorage.setItem('mb_sound_enabled', sound);
            alert('Pengaturan berhasil disimpan!');
        }
    </script> 
</head>

<body class="bg-gray-100 font-sans text-gray-800" onload="checkAdminAuth()">

    <!-- MODAL LOGIN RESTO -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center border-t-4 border-red-600">
            <h2 class="text-xl font-bold text-red-700 mb-1">Masuk Panel Resto</h2>
            <p class="text-xs text-gray-500 mb-4">Mie Bangka Teladan (Jalan Batu 8 Atas, Tanjungpinang)</p>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs font-bold text-gray-700">Nama Resto</label>
                    <input type="text" id="admin-username" class="w-full p-2 border rounded-lg text-sm mt-1 focus:ring-2 focus:ring-red-500 outline-none" placeholder="miebangka">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-700">Sandi</label>
                    <div class="relative mt-1">
                        <input type="password" id="admin-password" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none pr-10" placeholder="admin123">
                        <button type="button" onclick="toggleVisibility('admin-password', 'eye-1')" class="absolute right-3 top-2.5">
                            <i id="eye-1" class="fa-solid fa-eye text-gray-500"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-700">PIN Rahasia Resto</label>
                    <div class="relative mt-1">
                        <input type="password" id="admin-pin" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none pr-10" placeholder="886886">
                        <button type="button" onclick="toggleVisibility('admin-pin', 'eye-2')" class="absolute right-3 top-2.5">
                            <i id="eye-2" class="fa-solid fa-eye text-gray-500"></i>
                        </button>
                    </div>
                </div>
                <button onclick="verifyAdminLogin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition mt-2">
                    Masuk Panel
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER ADMIN PANEL -->
    <header class="bg-red-700 text-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <h1 class="font-bold text-lg">Panel Resto - Mie Bangka Teladan</h1>
                <select id="header-resto-status" onchange="changeRestoStatus(this.value)" class="bg-red-800 text-white border border-red-600 rounded px-2 py-1 text-xs font-bold">
                    <option value="Buka">Resto Buka</option>
                    <option value="Tutup">Resto Tutup</option>
                </select>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="logoutAdmin()" class="bg-black/30 hover:bg-black/50 px-3 py-1.5 rounded-lg text-xs font-bold">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </div>

        <!-- NAV TABS -->
        <div class="max-w-7xl mx-auto px-4 flex gap-6 text-sm overflow-x-auto border-t border-red-600 pt-2">
            <button id="tab-btn-orders" onclick="switchTab('orders')" class="font-bold border-b-2 border-white pb-1">Pesanan</button>
            <button id="tab-btn-menus" onclick="switchTab('menus')" class="text-red-200 hover:text-white pb-1">Kelola Menu</button>
            <button id="tab-btn-banners" onclick="switchTab('banners')" class="text-red-200 hover:text-white pb-1">Banner</button>
            <button id="tab-btn-banks" onclick="switchTab('banks')" class="text-red-200 hover:text-white pb-1">Rekening</button>
            <button id="tab-btn-settings" onclick="switchTab('settings')" class="text-red-200 hover:text-white pb-1">Pengaturan</button>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-7xl mx-auto p-4">

        <!-- TAB 1: PESANAN -->
        <section id="section-orders" class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-xl shadow">
                <div class="flex flex-wrap gap-2 text-xs">
                    <button onclick="filterOrders('Semua')" class="bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-lg font-bold">Semua</button>
                    <button onclick="filterOrders('Menunggu')" class="bg-blue-100 text-blue-800 hover:bg-blue-200 px-3 py-1.5 rounded-lg font-bold">Menunggu</button>
                    <button onclick="filterOrders('Diproses')" class="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 px-3 py-1.5 rounded-lg font-bold">Diproses</button>
                    <button onclick="filterOrders('Selesai')" class="bg-green-100 text-green-800 hover:bg-green-200 px-3 py-1.5 rounded-lg font-bold">Selesai</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="renderOrders()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg font-bold"><i class="fa-solid fa-rotate mr-1"></i> Refresh</button>
                    <button onclick="clearOrders()" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-3 py-1.5 rounded-lg font-bold">Hapus Riwayat</button>
                </div>
            </div>

            <div id="orders-list-container">
                <div class="bg-white p-6 rounded-xl shadow text-center text-gray-500">Memuat pesanan...</div>
            </div>
        </section>

        <!-- TAB 2: KELOLA MENU -->
        <section id="section-menus" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow">
                <h3 class="font-bold text-sm mb-3">Tambah Menu Baru</h3>
                <form id="form-add-menu" onsubmit="addMenu(event)" class="space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-gray-600">Nama Menu</label>
                            <input type="text" id="menu-name" required class="w-full p-2 border rounded text-xs mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">Harga (Rp)</label>
                            <input type="number" id="menu-price" required class="w-full p-2 border rounded text-xs mt-1">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold text-gray-600">Kategori</label>
                            <select id="menu-category" class="w-full p-2 border rounded text-xs mt-1">
                                <option value="Makanan">Makanan</option>
                                <option value="Minuman">Minuman</option>
                                <option value="Topping Tambahan">Topping Tambahan</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">URL Gambar (Opsional)</label>
                            <input type="url" id="menu-image-url" class="w-full p-2 border rounded text-xs mt-1" placeholder="https://...">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600">Atau Unggah File Gambar</label>
                        <input type="file" id="menu-image-file" accept="image/*" onchange="previewMenuImageFile(event)" class="w-full p-1 border rounded text-xs mt-1">
                        <div id="menu-img-preview-container" class="mt-2 hidden">
                            <img id="menu-img-preview" class="w-24 h-24 object-cover rounded border">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600">Deskripsi Menu</label>
                        <textarea id="menu-desc" class="w-full p-2 border rounded text-xs mt-1" rows="2"></textarea>
                    </div>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-4 py-2 rounded">Simpan Menu</button>
                </form>
            </div>

            <div id="menu-list-container">
                <div class="bg-white p-6 rounded-xl shadow text-center text-gray-500">Memuat daftar menu...</div>
            </div>
        </section>

        <!-- TAB 3: BANNER -->
        <section id="section-banners" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow">
                <h3 class="font-bold text-sm mb-3">Tambah Banner Promo</h3>
                <form id="form-add-banner" onsubmit="addBanner(event)" class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-600">Judul Banner</label>
                        <input type="text" id="banner-title" required class="w-full p-2 border rounded text-xs mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600">URL Gambar Banner</label>
                        <input type="url" id="banner-image" required class="w-full p-2 border rounded text-xs mt-1">
                    </div>
                    <button type="submit" class="bg-red-600 text-white font-bold text-xs px-4 py-2 rounded">Tambah Banner</button>
                </form>
            </div>
            <div id="banner-list-container"></div>
        </section>

        <!-- TAB 4: REKENING -->
        <section id="section-banks" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow">
                <h3 class="font-bold text-sm mb-3">Tambah Rekening Pembayaran</h3>
                <form id="form-add-bank" onsubmit="addBank(event)" class="space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <input type="text" id="bank-name" placeholder="Nama Bank / E-Wallet (BCA, DANA, dll)" required class="p-2 border rounded text-xs">
                        <input type="text" id="bank-accnum" placeholder="Nomor Rekening" required class="p-2 border rounded text-xs">
                        <input type="text" id="bank-accname" placeholder="Atas Nama" required class="p-2 border rounded text-xs">
                    </div>
                    <button type="submit" class="bg-red-600 text-white font-bold text-xs px-4 py-2 rounded">Tambah Rekening</button>
                </form>
            </div>
            <div id="bank-list-container"></div>
        </section>

        <!-- TAB 5: PENGATURAN -->
        <section id="section-settings" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow">
                <h3 class="font-bold text-sm mb-3">Pengaturan Resto</h3>
                <form onsubmit="saveSettings(event)" class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-600">Nomor WhatsApp Admin / Resto</label>
                        <input type="text" id="setting-wa" class="w-full p-2 border rounded text-xs mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-600">Biaya Ongkir Default (Rp)</label>
                        <input type="number" id="setting-fee" class="w-full p-2 border rounded text-xs mt-1">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="setting-sound">
                        <label class="text-xs font-bold text-gray-600">Aktifkan Suara Notifikasi Pesanan Masuk</label>
                    </div>
                    <button type="submit" class="bg-red-600 text-white font-bold text-xs px-4 py-2 rounded">Simpan Pengaturan</button>
                </form>
            </div>
        </section>

    </main>

</body>
</html>
