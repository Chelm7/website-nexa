<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Resto - Mie Bangka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: Arial, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans">

    <!-- LOGIN -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-sky-100">
            <h1 class="text-2xl font-extrabold text-sky-950 text-center mb-6">Panel Admin Resto</h1>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
                    <input id="admin-user" type="text" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                    <input id="admin-pass" type="password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm">
                </div>
                <button type="submit" class="w-full rounded-xl bg-sky-600 text-white px-4 py-3 font-bold hover:bg-sky-700 shadow">Masuk</button>
                <p id="login-error" class="text-center text-sm text-red-600 mt-2"></p>
            </form>
        </div>
    </div>

    <!-- PANEL UTAMA -->
    <div id="admin-panel" class="hidden min-h-screen flex flex-col">
        <header class="bg-sky-600 text-white shadow-lg sticky top-0 z-40">
            <div class="mx-auto max-w-7xl px-4 py-3 flex justify-between items-center">
                <h1 class="text-lg font-extrabold">Panel Resto - Mie Bangka</h1>
                <div class="flex items-center space-x-3">
                    <select id="resto-status-toggle" onchange="toggleRestoStatus(this.value)" class="rounded-xl bg-sky-700 text-white px-3 py-2 text-xs font-bold">
                        <option value="Buka">Resto Buka</option>
                        <option value="Tutup">Resto Tutup</option>
                    </select>
                    <button onclick="handleLogout()" class="bg-white text-sky-700 px-3 py-2 rounded-xl text-xs font-bold shadow">Keluar</button>
                </div>
            </div>
            <div class="bg-sky-700 px-4 flex space-x-2">
                <button onclick="switchTab('menu')" id="tab-btn-menu" class="tab-btn px-4 py-3 text-xs font-bold text-white border-b-2 border-white">Kelola Menu</button>
            </div>
        </header>

        <main class="container mx-auto px-4 py-6 max-w-7xl flex-1">
            <section id="tab-menu" class="tab-content active space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border max-w-2xl mx-auto">
                    <h2 class="text-lg font-extrabold text-sky-950 mb-3" id="menu-form-title">Tambah Menu Baru</h2>
                    <form id="menu-form" onsubmit="saveMenu(event)" class="space-y-4">
                        <input type="hidden" id="edit-menu-id">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Nama Menu</label>
                            <input id="menu-name" type="text" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Kategori</label>
                                <select id="menu-category" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm">
                                    <option value="Makanan">Makanan</option>
                                    <option value="Minuman">Minuman</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Harga (Rp)</label>
                                <input id="menu-price" type="number" min="0" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">URL Gambar Menu</label>
                            <input id="menu-image" type="url" placeholder="https://..." class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Deskripsi</label>
                            <textarea id="menu-desc" rows="2" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-sky-600 text-white font-bold py-2.5 rounded-xl text-sm">Simpan Menu</button>
                    </form>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border">
                    <h2 class="text-lg font-extrabold text-sky-950 mb-4">Daftar Menu Saat Ini</h2>
                    <div id="admin-menu-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        "use strict";
        const memoryStorage = {};
        function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return memoryStorage[key] || null; } }
        function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) { memoryStorage[key] = val; } }

        function checkLoginState() {
            if (safeGet('mb_admin_logged') === 'true') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                initAdminPanel();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('admin-user').value.trim();
            const p = document.getElementById('admin-pass').value.trim();
            if (u === 'admin' && p === 'admin123') {
                safeSet('mb_admin_logged', 'true');
                checkLoginState();
            } else {
                document.getElementById('login-error').textContent = 'Username atau Password salah!';
            }
        }

        function handleLogout() { safeSet('mb_admin_logged', 'false'); checkLoginState(); }

        function toggleRestoStatus(val) { safeSet('mb_resto_status', val); }

        function initAdminPanel() {
            document.getElementById('resto-status-toggle').value = safeGet('mb_resto_status') || 'Buka';
            renderAdminMenu();
        }

        function rupiah(value) {
            return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(value) || 0);
        }

        const defaultMenu = [
            { id: "menu-001", name: "Mie Bangka Spesial", category: "Makanan", price: 25000, description: "Mie kenyal khas dengan pangsit gurih.", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=80" },
            { id: "menu-002", name: "Mie Bangka Pangsit Kuah", category: "Makanan", price: 22000, description: "Mie hangat dengan kuah kaldu lezat.", image: "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80" },
            { id: "menu-003", name: "Es Jeruk Kunci", category: "Minuman", price: 8000, description: "Minuman segar.", image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=700&q=80" }
        ];

        function renderAdminMenu() {
            let menuList = [];
            try { menuList = JSON.parse(safeGet('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }
            const listDiv = document.getElementById('admin-menu-list');
            if(!listDiv) return;
            listDiv.innerHTML = '';
            menuList.forEach(m => {
                listDiv.innerHTML += `
                    <div class="border rounded-2xl p-4 flex flex-col justify-between bg-sky-50/50">
                        <div>
                            <div class="font-extrabold text-sky-950">${m.name}</div>
                            <div class="text-xs text-sky-700 font-bold mb-1">${m.category} - ${rupiah(m.price)}</div>
                            <p class="text-xs text-slate-600 line-clamp-2">${m.description || '-'}</p>
                        </div>
                        <div class="flex gap-2 mt-4 pt-3 border-t">
                            <button type="button" onclick="deleteMenu('${m.id}')" class="w-full bg-red-600 text-white py-1.5 rounded-xl text-xs font-bold hover:bg-red-700">Hapus</button>
                        </div>
                    </div>`;
            });
        }

        function saveMenu(event) {
            event.preventDefault();
            const id = "menu-" + Date.now();
            const name = document.getElementById('menu-name').value.trim();
            const category = document.getElementById('menu-category').value;
            const price = parseFloat(document.getElementById('menu-price').value) || 0;
            const image = document.getElementById('menu-image').value.trim();
            const description = document.getElementById('menu-desc').value.trim();

            let menuList = [];
            try { menuList = JSON.parse(safeGet('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }
            menuList.push({ id, name, category, price, image, description });
            safeSet('mb_menus', JSON.stringify(menuList));
            document.getElementById('menu-form').reset();
            renderAdminMenu();
        }

        function deleteMenu(menuId) {
            if(!confirm("Yakin ingin menghapus menu ini?")) return;
            let menuList = [];
            try { menuList = JSON.parse(safeGet('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }
            menuList = menuList.filter(m => String(m.id) !== String(menuId));
            safeSet('mb_menus', JSON.stringify(menuList));
            renderAdminMenu();
        }

        window.onload = checkLoginState;
    </script>
</body>
</html>
