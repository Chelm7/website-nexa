<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Bangka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .banner-slide { display: none; }
        .banner-slide.active { display: flex; animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0.3; } to { opacity: 1; } }
        .modal-hidden { display: none !important; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body class="bg-sky-50 text-slate-800 font-sans selection:bg-sky-500 selection:text-white">

    <!-- Notifikasi Resto Tutup -->
    <div id="resto-closed-banner" class="bg-red-600 text-white text-center py-2 px-4 text-xs font-bold hidden sticky top-0 z-50 shadow-md">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Mohon Maaf, Restoran saat ini sedang TUTUP / OFFLINE. Pesanan tidak dapat diproses.
    </div>

    <!-- Header / Navbar -->
    <header class="bg-sky-600 text-white shadow-lg sticky top-0 z-40">
        <div class="mx-auto max-w-7xl px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center space-x-3">
                    <div class="w-11 h-11 bg-white text-sky-600 rounded-full flex items-center justify-center font-bold text-xl shadow">
                        <i class="fa-solid fa-bowl-food"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-extrabold tracking-wide">Mie Bangka</h1>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-3">
                <div class="text-right text-xs bg-sky-700 px-3 py-1.5 rounded-lg border border-sky-500 hidden sm:block">
                    <div id="live-time" class="font-bold text-white text-sm">00:00:00</div>
                    <div id="live-date" class="text-sky-200">Senin, 01 Jan 2026</div>
                </div>
                <!-- Tombol Keranjang -->
                <button id="open-cart-button" onclick="openCart()" class="bg-white text-sky-700 border border-sky-300 hover:bg-sky-50 px-4 py-2 rounded-xl font-bold transition flex items-center shadow relative">
                    <i class="fa-solid fa-cart-shopping mr-2"></i> Keranjang
                    <span id="cart-count" class="ml-2 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Slider / Hero Section -->
    <section class="w-full bg-gradient-to-r from-sky-900 via-sky-700 to-cyan-600 text-white shadow-sm overflow-hidden relative group">
        <div id="banner-container" class="relative h-56 sm:h-72 md:h-96 w-full flex items-center justify-center"></div>
        
        <button onclick="changeBannerSlide(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white w-9 h-9 rounded-full flex items-center justify-center text-sm transition z-20 backdrop-blur-sm">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="changeBannerSlide(1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 text-white w-9 h-9 rounded-full flex items-center justify-center text-sm transition z-20 backdrop-blur-sm">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </section>

    <!-- Kategori & Daftar Menu -->
    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h2 class="text-2xl font-extrabold text-sky-950">Daftar Menu</h2>
                <p class="mt-1 text-sm text-slate-500">Pilih menu, masukkan ke keranjang, lalu kirim pesanan.</p>
            </div>

            <select
                id="category-filter"
                onchange="filterMenuSelect(this.value)"
                class="rounded-xl border border-sky-200 bg-white px-4 py-2 text-sm font-semibold text-sky-800 outline-none focus:ring-2 focus:ring-sky-500 shadow-sm"
            >
                <option value="Semua">Semua Menu</option>
                <option value="Makanan">Makanan</option>
                <option value="Minuman">Minuman</option>
            </select>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- MODAL KERANJANG -->
    <div id="cart-modal" class="modal-hidden fixed inset-0 z-50 overflow-y-auto bg-black/60 p-4 flex justify-center items-center">
        <div class="mx-auto my-5 max-w-lg w-full rounded-2xl bg-white p-5 shadow-2xl sm:p-7 relative max-h-[90vh] overflow-y-auto">

            <div class="flex items-center justify-between border-b pb-4">
                <h2 class="text-xl font-extrabold text-sky-950">Keranjang & Pembayaran</h2>
                <button type="button" onclick="closeCart()" class="rounded-lg px-3 py-1 text-2xl text-slate-500 hover:bg-slate-100">&times;</button>
            </div>

            <div id="cart-items" class="mt-4 max-h-48 space-y-3 overflow-y-auto divide-y divide-gray-200"></div>

            <div class="mt-5 border-t pt-4">
                <div class="flex items-center justify-between text-lg font-extrabold mb-4">
                    <span>Total</span>
                    <span id="cart-total" class="text-sky-700">Rp 0</span>
                </div>
            </div>

            <form id="checkout-form" onsubmit="submitOrderWhatsApp(event)" class="space-y-3">
                <div>
                    <label class="mb-1 block text-sm font-bold text-gray-700">Nama Pelanggan</label>
                    <input id="buyer-name" type="text" required placeholder="Nama lengkap" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="mb-1 block text-sm font-bold text-gray-700">Nomor HP / WhatsApp</label>
                    <input id="buyer-phone" type="tel" required placeholder="Contoh: 081234567890" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="mb-1 block text-sm font-bold text-gray-700">Nomor Meja / Alamat</label>
                    <input id="buyer-address" type="text" required placeholder="Contoh: Meja 3" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="mb-1 block text-sm font-bold text-gray-700">Metode Pembayaran</label>
                    <select id="payment-method" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500 font-medium">
                        <option value="Transfer Bank">Transfer Bank</option>
                        <option value="QRIS Manual">QRIS Manual</option>
                        <option value="Bayar di Tempat (Tunai)">Bayar di Tempat (Tunai)</option>
                    </select>
                </div>

                <button type="submit" class="w-full rounded-xl bg-emerald-600 text-white px-4 py-3 font-bold hover:bg-emerald-700 transition shadow flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Pesan via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-10 bg-sky-950 px-4 py-7 text-center text-sm text-sky-100">
        <p>&copy; 2026 Mie Bangka. All rights reserved.</p>
    </footer>

    <script>
        "use strict";
        const WHATSAPP_NUMBER = "6282384039200";

        const memoryStorage = {};
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return memoryStorage[key] || null; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) { memoryStorage[key] = val; }
        }

        function updateLiveClock() {
            const now = new Date();
            const timeEl = document.getElementById('live-time');
            const dateEl = document.getElementById('live-date');
            if (timeEl) timeEl.innerText = now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta' });
            if (dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        const defaultMenu = [
            { id: "menu-001", name: "Mie Bangka Spesial", category: "Makanan", price: 25000, description: "Mie kenyal khas dengan pangsit gurih.", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=80" },
            { id: "menu-002", name: "Mie Bangka Pangsit Kuah", category: "Makanan", price: 22000, description: "Mie hangat dengan kuah kaldu lezat.", image: "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80" },
            { id: "menu-003", name: "Es Jeruk Kunci", category: "Minuman", price: 8000, description: "Minuman segar.", image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=700&q=80" }
        ];

        let cart = new Map();
        let currentCategory = "Semua";
        let currentSlideIndex = 0;

        function initApp() {
            if (!safeGet('mb_menus')) safeSet('mb_menus', JSON.stringify(defaultMenu));
            if (!safeGet('mb_banners')) safeSet('mb_banners', JSON.stringify([
                "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80"
            ]));
            if (!safeGet('mb_resto_status')) safeSet('mb_resto_status', 'Buka');

            checkRestoStatus();
            loadBanners();
            renderMenu();
        }

        function checkRestoStatus() {
            const status = safeGet('mb_resto_status') || 'Buka';
            const banner = document.getElementById('resto-closed-banner');
            if (!banner) return;
            if (status === 'Tutup') banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }

        function loadBanners() {
            let banners = [];
            try { banners = JSON.parse(safeGet('mb_banners')) || []; } catch(e) { banners = []; }
            const container = document.getElementById('banner-container');
            if (!container) return;
            container.innerHTML = '';
            banners.forEach((b, idx) => {
                let bImg = typeof b === 'object' ? b.image : b;
                container.innerHTML += `<div class="banner-slide ${idx === 0 ? 'active' : ''} absolute inset-0 w-full h-full flex items-center justify-center"><img src="${bImg}" class="w-full h-full object-cover"></div>`;
            });
        }

        function changeBannerSlide(n) {
            const slides = document.getElementsByClassName('banner-slide');
            if (slides.length === 0) return;
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + n + slides.length) % slides.length;
            slides[currentSlideIndex].classList.add('active');
        }

        function filterMenuSelect(val) {
            currentCategory = val;
            renderMenu();
        }

        function rupiah(value) {
            return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(value) || 0);
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            if (!grid) return;
            let menuList = [];
            try { menuList = JSON.parse(safeGet('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }
            const filtered = currentCategory === "Semua" ? menuList : menuList.filter(m => m.category === currentCategory);
            grid.innerHTML = '';
            filtered.forEach(item => {
                grid.innerHTML += `
                    <article class="flex flex-col overflow-hidden rounded-2xl bg-white shadow-md border border-sky-100">
                        <div class="w-full h-48 bg-sky-100 relative overflow-hidden flex items-center justify-center text-sky-400">
                            <img src="${item.image}" onerror="this.style.display='none'" class="w-full h-48 object-cover">
                        </div>
                        <div class="flex flex-1 flex-col p-5">
                            <span class="w-fit rounded-full bg-sky-100 px-3 py-1 text-xs font-bold text-sky-700">${item.category}</span>
                            <h3 class="mt-3 text-lg font-extrabold text-sky-950">${item.name}</h3>
                            <p class="mt-2 flex-1 text-sm leading-6 text-slate-600 line-clamp-2">${item.description || '-'}</p>
                            <div class="mt-5 flex items-center justify-between gap-3">
                                <strong class="text-lg font-extrabold text-sky-700">${rupiah(item.price)}</strong>
                                <button type="button" onclick="addToCart('${item.id}')" class="rounded-xl bg-white text-sky-700 border border-sky-500 px-4 py-2 text-sm font-bold hover:bg-sky-50 transition shadow">Pesan</button>
                            </div>
                        </div>
                    </article>`;
            });
        }

        function addToCart(menuId) {
            if ((safeGet('mb_resto_status') || 'Buka') === 'Tutup') {
                alert("Restoran sedang tutup.");
                return;
            }
            const key = String(menuId);
            cart.set(key, (cart.get(key) || 0) + 1);
            renderCart();
        }

        function renderCart() {
            const cartItems = document.getElementById('cart-items');
            if (!cartItems) return;
            cartItems.innerHTML = '';
            let totalItems = 0, totalPrice = 0;
            let menuList = [];
            try { menuList = JSON.parse(safeGet('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }

            cart.forEach((quantity, menuId) => {
                const item = menuList.find(m => String(m.id) === String(menuId));
                if (!item) return;
                totalItems += quantity;
                totalPrice += item.price * quantity;
                cartItems.innerHTML += `
                    <div class="flex items-center justify-between gap-3 p-2">
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-bold text-slate-800 text-sm">${item.name}</p>
                            <p class="text-xs text-slate-500">${quantity} × ${rupiah(item.price)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="changeQuantity('${menuId}', -1)" class="rounded-lg bg-slate-100 px-2.5 py-1 font-bold">-</button>
                            <span class="min-w-5 text-center font-bold text-sm">${quantity}</span>
                            <button type="button" onclick="changeQuantity('${menuId}', 1)" class="rounded-lg bg-slate-100 px-2.5 py-1 font-bold">+</button>
                        </div>
                    </div>`;
            });

            if (totalItems === 0) cartItems.innerHTML = `<p class="py-5 text-center text-sm text-slate-500">Keranjang masih kosong.</p>`;
            const countEl = document.getElementById('cart-count');
            if (totalItems > 0) { countEl.textContent = totalItems; countEl.classList.remove('hidden'); } else { countEl.classList.add('hidden'); }
            document.getElementById('cart-total').textContent = rupiah(totalPrice);
        }

        function changeQuantity(menuId, delta) {
            const key = String(menuId);
            const newQty = (cart.get(key) || 0) + delta;
            if (newQty <= 0) cart.delete(key); else cart.set(key, newQty);
            renderCart();
        }

        function openCart() {
            if ((safeGet('mb_resto_status') || 'Buka') === 'Tutup') {
                alert("Restoran sedang tutup.");
                return;
            }
            document.getElementById('cart-modal').classList.remove('modal-hidden');
            renderCart();
        }

        function closeCart() { document.getElementById('cart-modal').classList.add('modal-hidden'); }

        function submitOrderWhatsApp(event) {
            event.preventDefault();
            if (cart.size === 0) { alert("Keranjang kosong!"); return; }

            const name = document.getElementById('buyer-name').value.trim();
            const phone = document.getElementById('buyer-phone').value.trim();
            const address = document.getElementById('buyer-address').value.trim();
            const payment = document.getElementById('payment-method').value;

            let menuList = [];
            try { menuList = JSON.parse(safeGet('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }

            let orderText = `Halo Kak, saya ingin memesan:\n\n*Nama:* ${name}\n*No. HP:* ${phone}\n*Meja/Alamat:* ${address}\n*Pembayaran:* ${payment}\n\n*Pesanan:*\n`;
            let total = 0;

            cart.forEach((qty, menuId) => {
                const item = menuList.find(m => String(m.id) === String(menuId));
                if (item) {
                    orderText += `- ${item.name} (${qty}x) @${rupiah(item.price)}\n`;
                    total += item.price * qty;
                }
            });

            orderText += `\n*Total Harga: ${rupiah(total)}*\n\nMohon segera diproses ya, terima kasih!`;

            const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(orderText)}`;
            window.open(waUrl, '_blank');
        }

        window.onload = initApp;
    </script>
</body>
</html>
