<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Bangka Teladan - Kota Tanjungpinang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: Arial, Helvetica, sans-serif; }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans selection:bg-sky-500 selection:text-white pb-24">

    <!-- AMARAN RESTO TUTUP / OFFLINE -->
    <div id="resto-closed-banner" class="hidden bg-red-600 text-white text-center py-3 px-4 text-xs sm:text-sm font-bold sticky top-0 z-50 shadow-md">
        <i class="fa-solid fa-triangle-exclamation mr-2"></i> Mohon Maaf, Resto Mie Bangka Teladan sedang **Tutup / Offline**. Belum dapat menerima pesanan saat ini.
    </div>

    <!-- Header Pelanggan -->
    <header class="bg-sky-600 text-white shadow-lg sticky top-0 z-40">
        <div class="mx-auto max-w-4xl px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white text-sky-600 rounded-full flex items-center justify-center font-bold text-lg shadow">
                    <i class="fa-solid fa-bowl-food"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold">Mie Bangka Teladan</h1>
                    <p class="text-[11px] text-sky-100">Jalan Batu 8 Atas, Kota Tanjungpinang</p>
                </div>
            </div>
            <button onclick="toggleCartModal(true)" class="relative bg-sky-700 hover:bg-sky-800 p-2.5 rounded-xl transition shadow flex items-center space-x-2">
                <i class="fa-solid fa-cart-shopping text-base"></i>
                <span id="cart-count" class="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container mx-auto px-4 py-6 max-w-4xl space-y-6">

        <!-- Banner Promosi -->
        <div id="banner-container" class="rounded-2xl overflow-hidden shadow-md bg-white border border-sky-100">
            <img id="active-banner-img" src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=80" class="w-full h-44 sm:h-60 object-cover">
        </div>

        <!-- Menu Makanan & Minuman -->
        <div>
            <h2 class="text-lg font-extrabold text-sky-950 mb-4 flex items-center">
                <i class="fa-solid fa-utensils text-sky-600 mr-2"></i> Menu Pilihan Resto
            </h2>
            <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Diisi oleh JS -->
            </div>
        </div>
    </main>

    <!-- Keranjang & Checkout Floating Bar -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-sky-100 p-4 shadow-2xl z-40 hidden">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-4">
            <div>
                <p class="text-xs text-slate-500">Total Pesanan:</p>
                <p id="cart-total-price" class="text-base font-extrabold text-sky-950">Rp 0</p>
            </div>
            <button onclick="openCheckoutModal()" id="checkout-main-btn" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl text-xs sm:text-sm transition shadow flex items-center">
                <i class="fa-solid fa-bag-shopping mr-2"></i> Lanjut Pesan
            </button>
        </div>
    </div>

    <!-- MODAL KERANJANG & CHECKOUT -->
    <div id="cart-modal" class="hidden fixed inset-0 z-50 bg-black/60 p-4 flex justify-center items-end sm:items-center">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto relative">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-base font-extrabold text-sky-950">Keranjang & Checkout Pesanan</h3>
                <button onclick="toggleCartModal(false)" class="text-slate-400 hover:text-slate-600 text-lg font-bold px-2">&times;</button>
            </div>

            <div id="cart-items-list" class="space-y-3 mb-4 max-h-48 overflow-y-auto pr-1">
                <!-- Item keranjang -->
            </div>

            <form onsubmit="submitOrder(event)" class="space-y-3 pt-2 border-t">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Pemesan</label>
                    <input id="buyer-name" type="text" required placeholder="Nama Anda" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nomor HP / WhatsApp</label>
                    <input id="buyer-phone" type="tel" required placeholder="08xxxxxxxxxx" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nomor Meja / Alamat Pengantaran</label>
                    <input id="buyer-address" type="text" required placeholder="Contoh: Meja 5 atau Alamat" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Metode Pembayaran</label>
                    <select id="payment-method-select" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                        <!-- Diisi dari admin -->
                    </select>
                </div>

                <button type="submit" id="final-submit-btn" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl text-sm transition shadow mt-2">
                    Kirim Pesanan Sekarang
                </button>
            </form>
        </div>
    </div>

    <script>
        const SHEETDB_API = "https://sheetdb.io/api/v1/2ij5jepgf1fdy";
        let cart = [];

        function rupiah(value) {
            return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(value);
        }

        function checkRestoStatusWeb() {
            const status = localStorage.getItem('mb_resto_status') || 'Buka';
            const banner = document.getElementById('resto-closed-banner');
            const checkoutMainBtn = document.getElementById('checkout-main-btn');
            const finalSubmitBtn = document.getElementById('final-submit-btn');

            if (status === 'Tutup') {
                if(banner) banner.classList.remove('hidden');
                if(checkoutMainBtn) {
                    checkoutMainBtn.disabled = true;
                    checkoutMainBtn.textContent = "Resto Tutup / Offline";
                    checkoutMainBtn.className = "bg-gray-400 text-white font-bold px-6 py-3 rounded-xl text-xs sm:text-sm cursor-not-allowed";
                }
                if(finalSubmitBtn) {
                    finalSubmitBtn.disabled = true;
                    finalSubmitBtn.textContent = "Resto Sedang Tutup";
                    finalSubmitBtn.className = "w-full bg-gray-400 text-white font-bold py-3 rounded-xl text-sm cursor-not-allowed";
                }
            } else {
                if(banner) banner.classList.add('hidden');
                if(checkoutMainBtn) {
                    checkoutMainBtn.disabled = false;
                    checkoutMainBtn.innerHTML = '<i class="fa-solid fa-bag-shopping mr-2"></i> Lanjut Pesan';
                    checkoutMainBtn.className = "bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl text-xs sm:text-sm transition shadow flex items-center";
                }
                if(finalSubmitBtn) {
                    finalSubmitBtn.disabled = false;
                    finalSubmitBtn.textContent = "Kirim Pesanan Sekarang";
                    finalSubmitBtn.className = "w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl text-sm transition shadow mt-2";
                }
            }
        }

        const defaultMenu = [
            { id: "menu-001", name: "Mie Bangka Spesial (Topping B2)", category: "Makanan", price: 25000, description: "Mie kenyal khas Bangka dengan topping cincang B2 gurih dan pangsit.", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=700&q=80" },
            { id: "menu-002", name: "Mie Bangka Pangsit Kuah", category: "Makanan", price: 22000, description: "Mie hangat dengan kuah kaldu lezat dan pangsit rebus.", image: "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=700&q=80" },
            { id: "menu-003", name: "Es Jeruk Kunci Bangka", category: "Minuman", price: 8000, description: "Minuman segar dengan jeruk kunci khas Bangka.", image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=700&q=80" }
        ];

        function loadWebMenu() {
            let menuList = [];
            try { menuList = JSON.parse(localStorage.getItem('mb_menus')) || defaultMenu; } catch(e) { menuList = defaultMenu; }
            const grid = document.getElementById('menu-grid');
            if(!grid) return;
            grid.innerHTML = '';

            menuList.forEach(m => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-sky-100 flex gap-4 items-center">
                        <img src="${m.image || 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=300&q=80'}" class="w-24 h-24 object-cover rounded-xl bg-sky-50">
                        <div class="flex-1">
                            <h3 class="font-extrabold text-sky-950 text-sm">${m.name}</h3>
                            <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${m.description || '-'}</p>
                            <p class="text-sm font-extrabold text-sky-700 mt-1">${rupiah(m.price)}</p>
                            <button onclick='addToCart(${JSON.stringify(m)})' class="mt-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow transition">
                                <i class="fa-solid fa-plus mr-1"></i> Tambah
                            </button>
                        </div>
                    </div>`;
            });
        }

        function loadWebBanners() {
            let banners = [];
            try { banners = JSON.parse(localStorage.getItem('mb_banners')) || []; } catch(e) { banners = []; }
            if(banners.length > 0) {
                let imgUrl = typeof banners[0] === 'object' ? banners[0].image : banners[0];
                document.getElementById('active-banner-img').src = imgUrl;
            }
        }

        function loadWebPaymentMethods() {
            let methodsText = localStorage.getItem('mb_payment_methods') || "BCA - 1234567890 (a.n. Mie Bangka Teladan)\nDANA - 081267166886 (a.n. Mie Bangka Teladan)\nKasir (Tunai)";
            let lines = methodsText.split('\n');
            const select = document.getElementById('payment-method-select');
            if(!select) return;
            select.innerHTML = '';
            lines.forEach(l => {
                if(l.trim()) {
                    select.innerHTML += `<option value="${l.trim()}">${l.trim()}</option>`;
                }
            });
        }

        function addToCart(menu) {
            const status = localStorage.getItem('mb_resto_status') || 'Buka';
            if (status === 'Tutup') {
                alert("Mohon maaf, Resto sedang Tutup / Offline. Tidak dapat menambah pesanan.");
                return;
            }
            let exist = cart.find(i => i.id === menu.id);
            if(exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...menu, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total-price');
            const cartBar = document.getElementById('cart-bar');
            const listEl = document.getElementById('cart-items-list');

            let totalQty = 0;
            let totalPrice = 0;

            listEl.innerHTML = '';
            cart.forEach((item, idx) => {
                totalQty += item.qty;
                totalPrice += (item.price * item.qty);
                listEl.innerHTML += `
                    <div class="flex justify-between items-center bg-sky-50 p-2.5 rounded-xl text-xs">
                        <div>
                            <div class="font-bold text-sky-950">${item.name}</div>
                            <div class="text-slate-500">${rupiah(item.price)} x ${item.qty}</div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${idx}, -1)" class="bg-white border px-2 py-0.5 rounded font-bold">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="bg-white border px-2 py-0.5 rounded font-bold">+</button>
                        </div>
                    </div>`;
            });

            countEl.textContent = totalQty;
            totalEl.textContent = rupiah(totalPrice);

            if(cart.length > 0) {
                cartBar.classList.remove('hidden');
            } else {
                cartBar.classList.add('hidden');
                toggleCartModal(false);
            }
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if(cart[idx].qty <= 0) {
                cart.splice(idx, 1);
            }
            updateCartUI();
        }

        function toggleCartModal(show) {
            const modal = document.getElementById('cart-modal');
            if(show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function openCheckoutModal() {
            const status = localStorage.getItem('mb_resto_status') || 'Buka';
            if (status === 'Tutup') {
                alert("Mohon maaf, Resto sedang Tutup / Offline. Pesanan tidak dapat diproses.");
                return;
            }
            toggleCartModal(true);
        }

        async function submitOrder(e) {
            e.preventDefault();
            const status = localStorage.getItem('mb_resto_status') || 'Buka';
            if (status === 'Tutup') {
                alert("Resto sedang Tutup / Offline.");
                return;
            }

            const name = document.getElementById('buyer-name').value.trim();
            const phone = document.getElementById('buyer-phone').value.trim();
            const address = document.getElementById('buyer-address').value.trim();
            const payment = document.getElementById('payment-method-select').value;

            let totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let orderId = "ORD-" + Math.random().toString(36).substr(2, 8).toUpperCase();
            let now = new Date();
            let dateStr = now.toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'}) + ', ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            let newOrder = {
                id: orderId,
                createdAt: Date.now(),
                created_at: dateStr,
                name: name,
                phone: phone,
                address: address,
                items: JSON.stringify(cart),
                total: totalPrice,
                payment: payment,
                status: 'Menunggu'
            };

            // Simpan lokal
            let orders = [];
            try { orders = JSON.parse(localStorage.getItem('mb_orders') || '[]'); } catch(e) {}
            orders.unshift(newOrder);
            localStorage.setItem('mb_orders', JSON.stringify(orders));

            // Hantar ke SheetDB
            try {
                await fetch(SHEETDB_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ data: newOrder })
                });
            } catch(err) {
                console.log("Cloud sync note:", err);
            }

            alert("Pesanan berhasil dikirim! ID Pesanan Anda: " + orderId);
            cart = [];
            updateCartUI();
            toggleCartModal(false);
            e.target.reset();
        }

        window.onload = function() {
            checkRestoStatusWeb();
            loadWebMenu();
            loadWebBanners();
            loadWebPaymentMethods();
            setInterval(checkRestoStatusWeb, 3000);
        };
    </script>
</body>
</html>
