<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Bangka Teladan - Kota Tanjungpinang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon Dinamis (Otomatis berubah sesuai Logo Web dari Panel Admin) -->
    <link id="dynamic-favicon" rel="icon" type="image/png" href="">
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Header / Brand Utama Web -->
    <header class="bg-[#0284c7] text-white shadow sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-3">
                    <!-- Lingkaran Logo Website (Sinkron Otomatis dari Admin) -->
                    <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center overflow-hidden shadow border shrink-0">
                        <img id="public-brand-logo" src="" class="w-full h-full object-cover hidden" alt="Logo Mie Bangka">
                        <i id="default-logo-icon" class="fa-solid fa-bowl-food text-sky-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Mie Bangka Teladan</h1>
                        <p class="text-xs text-sky-100">Kota Tanjungpinang</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="resto-status-badge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-green-500 text-white shadow">Buka</span>
                    <a href="admin.html" class="bg-sky-800 hover:bg-sky-900 text-white text-xs px-3 py-1.5 rounded font-bold shadow">Panel Admin</a>
                </div>
            </div>

            <!-- Widget Tanggal & Keranjang -->
            <div class="flex justify-between items-center gap-2 pt-2 border-t border-sky-500/50">
                <div id="live-clock-box" class="bg-sky-900/60 text-xs px-3 py-1.5 rounded-lg font-medium text-sky-100 shadow-inner">
                    Memuat waktu...
                </div>
                <button onclick="toggleCartModal()" class="bg-white text-sky-800 hover:bg-sky-50 text-xs px-4 py-1.5 rounded-lg font-bold shadow flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Keranjang <span id="cart-count-badge" class="bg-sky-600 text-white px-1.5 py-0.2 rounded-full text-[10px]">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Konten Utama Web -->
    <main class="max-w-7xl mx-auto px-4 py-4 space-y-4">
        
        <!-- Banner Promo Carousel -->
        <div class="bg-white rounded-xl shadow p-2 text-center relative overflow-hidden">
            <div id="banner-container" class="flex transition-all duration-300">
                <div class="w-full shrink-0 p-2">
                    <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80" class="w-full h-48 object-cover rounded-lg shadow-sm" alt="Banner Promo">
                </div>
            </div>
            <div class="flex justify-center gap-2 mt-2">
                <button onclick="prevBanner()" class="bg-sky-100 hover:bg-sky-200 text-sky-800 text-xs px-3 py-1 rounded-lg font-bold"><i class="fa-solid fa-chevron-left mr-1"></i> Sebelumnya</button>
                <button onclick="nextBanner()" class="bg-sky-100 hover:bg-sky-200 text-sky-800 text-xs px-3 py-1 rounded-lg font-bold">Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i></button>
            </div>
        </div>

        <!-- Kategori Menu -->
        <div class="flex gap-2 overflow-x-auto py-1">
            <button onclick="filterPublicMenu('Semua')" id="cat-btn-Semua" class="bg-sky-600 text-white text-xs px-4 py-2 rounded-xl font-bold shadow shrink-0">Semua Menu</button>
            <button onclick="filterPublicMenu('Makanan')" id="cat-btn-Makanan" class="bg-white hover:bg-gray-50 text-gray-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm shrink-0 border">Makanan</button>
            <button onclick="filterPublicMenu('Minuman')" id="cat-btn-Minuman" class="bg-white hover:bg-gray-50 text-gray-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm shrink-0 border">Minuman</button>
        </div>

        <!-- Daftar Menu -->
        <div id="public-menu-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Menu dimuat otomatis dari localStorage -->
        </div>

    </main>

    <!-- Modal Keranjang / Checkout -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-gray-800 text-base"><i class="fa-solid fa-cart-shopping mr-2 text-sky-600"></i>Keranjang Belanja</h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            
            <div id="cart-items-container" class="space-y-3 mb-4">
                <!-- Item keranjang -->
            </div>

            <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between font-bold text-gray-800">
                    <span>Total Pembayaran:</span>
                    <span id="cart-total-price" class="text-sky-600">Rp 0</span>
                </div>

                <div class="space-y-2 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nama Pemesan</label>
                        <input type="text" id="buyer-name" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500" placeholder="Nama Anda...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nomor WhatsApp</label>
                        <input type="tel" id="buyer-phone" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500" placeholder="08xxxxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Alamat Pengiriman</label>
                        <textarea id="buyer-address" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500" placeholder="Alamat lengkap..."></textarea>
                    </div>
                </div>

                <button onclick="checkoutOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl text-sm shadow transition mt-3">
                    <i class="fa-brands fa-whatsapp mr-1"></i> Pesan Sekarang via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Skrip Lengkap -->
    <script>
        let cart = [];
        let currentCategory = 'Semua';
        let currentBannerIdx = 0;

        window.addEventListener('DOMContentLoaded', () => {
            // 1. Sinkronisasi Logo Web & Favicon dari Panel Admin
            let savedLogo = localStorage.getItem('mb_site_logo');
            if (savedLogo) {
                let brandLogo = document.getElementById('public-brand-logo');
                let defaultIcon = document.getElementById('default-logo-icon');
                let favicon = document.getElementById('dynamic-favicon');

                if (brandLogo) {
                    brandLogo.src = savedLogo;
                    brandLogo.classList.remove('hidden');
                }
                if (defaultIcon) {
                    defaultIcon.classList.add('hidden');
                }
                if (favicon) {
                    favicon.href = savedLogo;
                }
            }

            // 2. Cek Status Resto
            let restoStatus = localStorage.getItem('mb_resto_status') || 'Buka';
            let statusBadge = document.getElementById('resto-status-badge');
            if (statusBadge) {
                statusBadge.innerText = restoStatus;
                if (restoStatus === 'Tutup') {
                    statusBadge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-red-500 text-white shadow";
                }
            }

            // 3. Jam & Tanggal Realtime
            updateClock();
            setInterval(updateClock, 1000);

            // 4. Render Banner & Menu
            renderPublicBanners();
            renderPublicMenus();
        });

        function updateClock() {
            let now = new Date();
            let timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
            let dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
            let clockBox = document.getElementById('live-clock-box');
            if (clockBox) {
                clockBox.innerText = `${timeStr} - ${dateStr}`;
            }
        }

        function renderPublicMenus() {
            let container = document.getElementById('public-menu-list');
            if (!container) return;
            let menus = JSON.parse(localStorage.getItem('mb_menus') || '[]');
            
            let filtered = menus.filter(m => {
                if (currentCategory === 'Semua') return true;
                return m.category === currentCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-500 col-span-full">Belum ada menu tersedia untuk kategori ini.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(m => {
                let img = m.image || 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=500&q=80';
                html += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between">
                        <div>
                            <img src="${img}" class="w-full h-40 object-cover rounded-lg mb-3 border">
                            <span class="text-[10px] font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full">${m.category || 'Makanan'}</span>
                            <h3 class="font-bold text-gray-800 mt-1">${m.name}</h3>
                            <p class="text-xs text-sky-700 font-bold mb-1">Rp ${Number(m.price).toLocaleString('id-ID')}</p>
                            <p class="text-xs text-gray-600">${m.desc || '-'}</p>
                        </div>
                        <button onclick="addToCart('${m.name}', ${m.price})" class="mt-4 bg-sky-600 hover:bg-sky-700 text-white text-xs py-2 rounded-lg font-bold shadow transition">
                            <i class="fa-solid fa-plus mr-1"></i> Tambah ke Keranjang
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterPublicMenu(cat) {
            currentCategory = cat;
            ['Semua', 'Makanan', 'Minuman'].forEach(c => {
                let btn = document.getElementById(`cat-btn-${c}`);
                if (btn) {
                    if (c === cat) {
                        btn.className = "bg-sky-600 text-white text-xs px-4 py-2 rounded-xl font-bold shadow shrink-0";
                    } else {
                        btn.className = "bg-white hover:bg-gray-50 text-gray-700 text-xs px-4 py-2 rounded-xl font-bold shadow-sm shrink-0 border";
                    }
                }
            });
            renderPublicMenus();
        }

        function renderPublicBanners() {
            let banners = JSON.parse(localStorage.getItem('mb_banners') || '[]');
            let container = document.getElementById('banner-container');
            if (!container || banners.length === 0) return;
            let html = '';
            banners.forEach(b => {
                html += `<div class="w-full shrink-0 p-2"><img src="${b}" class="w-full h-48 object-cover rounded-lg shadow-sm" alt="Promo"></div>`;
            });
            container.innerHTML = html;
        }

        function nextBanner() {
            let banners = JSON.parse(localStorage.getItem('mb_banners') || '[]');
            if (banners.length <= 1) return;
            currentBannerIdx = (currentBannerIdx + 1) % banners.length;
            let container = document.getElementById('banner-container');
            if (container) {
                container.style.transform = `translateX(-${currentBannerIdx * 100}%)`;
            }
        }

        function prevBanner() {
            let banners = JSON.parse(localStorage.getItem('mb_banners') || '[]');
            if (banners.length <= 1) return;
            currentBannerIdx = (currentBannerIdx - 1 + banners.length) % banners.length;
            let container = document.getElementById('banner-container');
            if (container) {
                container.style.transform = `translateX(-${currentBannerIdx * 100}%)`;
            }
        }

        function addToCart(name, price) {
            let existing = cart.find(i => i.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
            alert(`${name} ditambahkan ke keranjang.`);
        }

        function updateCartUI() {
            let countBadge = document.getElementById('cart-count-badge');
            let totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            if (countBadge) countBadge.innerText = totalQty;

            let container = document.getElementById('cart-items-container');
            let totalPriceEl = document.getElementById('cart-total-price');
            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Keranjang masih kosong.</p>`;
                if (totalPriceEl) totalPriceEl.innerText = 'Rp 0';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, idx) => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                html += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-xs">
                        <div>
                            <p class="font-bold text-gray-800">${item.name}</p>
                            <p class="text-sky-600">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${idx}, 1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold">+</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${idx}, -1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold">-</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            if (totalPriceEl) totalPriceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function changeQty(idx, amt) {
            cart[idx].qty += amt;
            if (cart[idx].qty <= 0) {
                cart.splice(idx, 1);
            }
            updateCartUI();
        }

        function toggleCartModal() {
            let modal = document.getElementById('cart-modal');
            if (modal) {
                modal.classList.toggle('hidden');
                updateCartUI();
            }
        }

        function checkoutOrder() {
            if (cart.length === 0) {
                alert('Keranjang masih kosong!');
                return;
            }
            let name = document.getElementById('buyer-name').value.trim();
            let phone = document.getElementById('buyer-phone').value.trim();
            let address = document.getElementById('buyer-address').value.trim();

            if (!name || !phone || !address) {
                alert('Mohon lengkapi Nama, No WhatsApp, dan Alamat pengiriman.');
                return;
            }

            let total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let orderItemsDesc = cart.map(i => `- ${i.name} (${i.qty}x) Rp ${(i.price * i.qty).toLocaleString('id-ID')}`).join('%0A');

            let newOrder = {
                id: Date.now(),
                date: new Date().toLocaleDateString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                name: name,
                phone: phone,
                address: address,
                items: cart,
                total: total,
                status: 'Menunggu',
                payment: 'WhatsApp / Transfer'
            };

            let orders = JSON.parse(localStorage.getItem('mb_orders') || '[]');
            orders.push(newOrder);
            localStorage.setItem('mb_orders', JSON.stringify(orders));

            let adminWa = localStorage.getItem('mb_whatsapp') || '081267166886';
            if (adminWa.startsWith('0')) {
                adminWa = '62' + adminWa.slice(1);
            }

            let waMessage = `Halo Admin Mie Bangka Teladan,%0A%0ASaya ingin memesan:%0A${orderItemsDesc}%0A%0A*Total:* Rp ${total.toLocaleString('id-ID')}%0A%0A*Nama:* ${name}%0A*No HP:* ${phone}%0A*Alamat:* ${address}`;

            alert('Pesanan berhasil dibuat!');
            window.open(`https://wa.me/${adminWa}?text=${waMessage}`, '_blank');
            cart = [];
            toggleCartModal();
            location.reload();
        }
    </script>
</body>
</html>
