<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Bangka Teladan - Kota Tanjungpinang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .banner-slide { display: none; }
        .banner-slide.active { display: block; animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-sky-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-sky-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-2">
            <!-- Kiri: Logo & Brand -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white text-sky-600 rounded-full flex items-center justify-center font-bold text-xl shadow">
                    <i class="fa-solid fa-bowl-food"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide">Mie Bangka Teladan</h1>
                    <p class="text-xs text-sky-100">Kota Tanjungpinang</p>
                </div>
            </div>

            <!-- Kanan: Jam Digital & Keranjang -->
            <div class="flex items-center space-x-4">
                <div class="text-right text-xs bg-sky-700 px-3 py-1.5 rounded-lg border border-sky-500">
                    <div id="live-time" class="font-bold text-white text-sm">00:00:00</div>
                    <div id="live-date" class="text-sky-200">Senin, 01 Jan 2026</div>
                </div>
                <button onclick="toggleCart()" class="bg-white text-sky-600 hover:bg-sky-50 px-4 py-2 rounded-xl font-bold transition flex items-center shadow">
                    <i class="fa-solid fa-cart-shopping mr-2"></i> Keranjang
                    <span id="cart-count" class="ml-2 bg-sky-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Slider Dinamis -->
    <section class="relative bg-sky-700 text-white py-16 px-4 text-center overflow-hidden">
        <div id="banner-container" class="container mx-auto max-w-3xl relative min-h-[160px] flex items-center justify-center">
            <!-- Banner dimuat otomatis -->
        </div>
        <button onclick="changeBannerSlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black bg-opacity-30 hover:bg-opacity-50 text-white w-9 h-9 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="changeBannerSlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black bg-opacity-30 hover:bg-opacity-50 text-white w-9 h-9 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-chevron-right"></i></button>
    </section>

    <!-- Kategori Menu (Makanan & Minuman) -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-center space-x-4 mb-8">
            <button onclick="filterMenu('all')" id="btn-all" class="px-6 py-2 rounded-xl font-bold bg-sky-600 text-white shadow transition">Semua Menu</button>
            <button onclick="filterMenu('Makanan')" id="btn-makanan" class="px-6 py-2 rounded-xl font-bold bg-white text-sky-600 border border-sky-300 shadow transition">Makanan</button>
            <button onclick="filterMenu('Minuman')" id="btn-minuman" class="px-6 py-2 rounded-xl font-bold bg-white text-sky-600 border border-sky-300 shadow transition">Minuman</button>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Menu dinamis -->
        </div>

        <!-- Cek Status Pesanan Saya -->
        <div class="mt-16 bg-white p-6 rounded-2xl shadow-md border border-sky-100 max-w-xl mx-auto text-center">
            <h3 class="text-xl font-bold text-sky-900 mb-2"><i class="fa-solid fa-magnifying-glass mr-2"></i> Lacak Status Pesanan Anda</h3>
            <p class="text-sm text-gray-500 mb-4">Masukkan ID Pesanan atau Nama Anda untuk melihat status terbaru.</p>
            <div class="flex space-x-2">
                <input type="text" id="track-id" placeholder="Contoh: ORD-172839 atau Nama" class="flex-grow px-4 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 outline-none">
                <button onclick="checkOrderStatus()" class="bg-white text-sky-600 border border-sky-600 hover:bg-sky-50 px-6 py-2 rounded-xl font-bold transition shadow">Cek Status</button>
            </div>
            <div id="track-result" class="mt-4 text-left"></div>
        </div>
    </main>

    <!-- Modal Keranjang & Pembayaran -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-2xl font-bold mb-4 text-sky-900"><i class="fa-solid fa-basket-shopping mr-2"></i> Keranjang & Pembayaran</h3>
            
            <div id="cart-items" class="divide-y divide-gray-200 mb-4 max-h-48 overflow-y-auto"></div>

            <div class="border-t pt-4 mb-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total Pembayaran:</span>
                    <span id="cart-total" class="text-sky-600">Rp 0</span>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Pemesan</label>
                        <input type="text" id="buyer-name" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Nama lengkap">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nomor Meja / Alamat Pengiriman</label>
                        <input type="text" id="buyer-address" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Nomor Meja atau Alamat di Tanjungpinang">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Metode Pembayaran</label>
                        <select id="payment-method" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-sky-500 outline-none font-medium">
                            <option value="">-- Pilih Pembayaran --</option>
                            <option value="Kasir">Bayar di Kasir (Tunai/Langsung)</option>
                        </select>
                    </div>

                    <div>
                        <label class="flex items-center mt-2">
                            <input type="checkbox" id="payment-confirmed" class="w-4 h-4 text-sky-600 rounded">
                            <span class="ml-2 text-xs text-gray-700 font-medium">Saya centang sebagai konfirmasi pembayaran.</span>
                        </label>
                    </div>
                </div>
            </div>

            <button onclick="checkout()" class="w-full bg-white text-sky-600 border-2 border-sky-600 hover:bg-sky-50 font-bold py-3 rounded-xl transition shadow">
                <i class="fa-solid fa-check mr-2"></i> Konfirmasi Pembayaran
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-sky-900 text-sky-100 py-6 text-center mt-12 text-sm">
        <p>&copy; 2026 Mie Bangka Teladan - Kota Tanjungpinang (<span id="domain-label">masak-masak.my.id</span>). All rights reserved.</p>
    </footer>

    <!-- Audio Sukses -->
    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        function updateLiveClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta' });
            const dateString = now.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
            document.getElementById('live-time').innerText = timeString;
            document.getElementById('live-date').innerText = dateString;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        const defaultMenu = [
            { id: 1, name: "Mie Bangka Spesial", category: "Makanan", price: 25000, desc: "Mie kenyal dengan topping cincang daging gurih dan bakso ikan.", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Mie Bangka Pangsit Kuah", category: "Makanan", price: 22000, desc: "Disajikan hangat dengan kaldu lezat dan pangsit lembut.", image: "https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Es Timun Serut", category: "Minuman", price: 8000, desc: "Minuman segar pereda penyejuk dahaga.", image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];
        let currentCategory = 'all';
        let currentSlideIndex = 0;

        function initApp() {
            if (!localStorage.getItem('mb_menu')) {
                localStorage.setItem('mb_menu', JSON.stringify(defaultMenu));
            }
            if (!localStorage.getItem('mb_banners')) {
                localStorage.setItem('mb_banners', JSON.stringify([
                    "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80",
                    "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1200&q=80"
                ]));
            }
            loadBanners();
            renderMenu();
            loadBankOptions();
        }

        function loadBanners() {
            const banners = JSON.parse(localStorage.getItem('mb_banners')) || [];
            const container = document.getElementById('banner-container');
            container.innerHTML = '';
            banners.forEach((b, idx) => {
                container.innerHTML += `
                    <div class="banner-slide ${idx === 0 ? 'active' : ''} w-full">
                        <img src="${b}" class="absolute inset-0 w-full h-full object-cover opacity-25">
                        <div class="relative z-10 py-6">
                            <h2 class="text-3xl md:text-4xl font-extrabold mb-2">Mie Bangka Teladan</h2>
                            <p class="text-sky-100 text-sm md:text-base">Cita rasa legendaris autentik di Kota Tanjungpinang.</p>
                        </div>
                    </div>
                `;
            });
        }

        function changeBannerSlide(n) {
            const slides = document.getElementsByClassName('banner-slide');
            if(slides.length === 0) return;
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + n + slides.length) % slides.length;
            slides[currentSlideIndex].classList.add('active');
        }
        setInterval(() => { changeBannerSlide(1); }, 5000);

        function filterMenu(cat) {
            currentCategory = cat;
            document.getElementById('btn-all').className = cat === 'all' ? "px-6 py-2 rounded-xl font-bold bg-sky-600 text-white shadow transition" : "px-6 py-2 rounded-xl font-bold bg-white text-sky-600 border border-sky-300 shadow transition";
            document.getElementById('btn-makanan').className = cat === 'Makanan' ? "px-6 py-2 rounded-xl font-bold bg-sky-600 text-white shadow transition" : "px-6 py-2 rounded-xl font-bold bg-white text-sky-600 border border-sky-300 shadow transition";
            document.getElementById('btn-minuman').className = cat === 'Minuman' ? "px-6 py-2 rounded-xl font-bold bg-sky-600 text-white shadow transition" : "px-6 py-2 rounded-xl font-bold bg-white text-sky-600 border border-sky-300 shadow transition";
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const menuList = JSON.parse(localStorage.getItem('mb_menu')) || [];
            const filtered = currentCategory === 'all' ? menuList : menuList.filter(m => m.category === currentCategory);

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-8">Belum ada menu dalam kategori ini.</p>`;
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-md overflow-hidden flex flex-col justify-between border border-sky-100 hover:shadow-lg transition">
                        <div>
                            <img src="${item.image || 'https://via.placeholder.com/400x300'}" class="w-full h-48 object-cover">
                            <div class="p-5">
                                <span class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-full">${item.category}</span>
                                <h4 class="font-bold text-xl text-sky-900 mt-2 mb-1">${item.name}</h4>
                                <p class="text-gray-600 text-sm mb-4">${item.desc}</p>
                            </div>
                        </div>
                        <div class="px-5 pb-5 flex justify-between items-center">
                            <span class="text-lg font-bold text-sky-700">Rp ${item.price.toLocaleString('id-ID')}</span>
                            <button onclick="addToCart(${item.id})" class="bg-white text-sky-600 border border-sky-600 hover:bg-sky-50 px-4 py-2 rounded-xl text-sm font-bold transition shadow">
                                <i class="fa-solid fa-plus mr-1"></i> Pesan
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const menuList = JSON.parse(localStorage.getItem('mb_menu')) || [];
            const product = menuList.find(p => p.id === id);
            if (!product) return;

            const existing = cart.find(i => i.id === id);
            if (existing) { existing.qty += 1; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
            alert(`${product.name} ditambahkan ke keranjang.`);
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');

            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="py-3 flex justify-between items-center text-sm">
                        <div>
                            <div class="font-bold text-gray-800">${item.name}</div>
                            <div class="text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${idx}, -1)" class="bg-gray-100 px-2 py-1 rounded">-</button>
                            <span class="font-bold">${item.qty}</span>
                            <button onclick="changeQty(${idx}, 1)" class="bg-gray-100 px-2 py-1 rounded">+</button>
                        </div>
                    </div>
                `;
            });
            totalEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function loadBankOptions() {
            const select = document.getElementById('payment-method');
            const banks = JSON.parse(localStorage.getItem('mb_banks')) || [];
            
            select.innerHTML = `<option value="">-- Pilih Pembayaran --</option><option value="Kasir">Bayar di Kasir (Tunai)</option>`;
            banks.forEach(b => {
                select.innerHTML += `<option value="${b.name} - ${b.account} (a.n. ${b.holder})">${b.name} - ${b.account} (a.n. ${b.holder})</option>`;
            });
        }

        function checkout() {
            const name = document.getElementById('buyer-name').value.trim();
            const address = document.getElementById('buyer-address').value.trim();
            const payment = document.getElementById('payment-method').value;
            const confirmed = document.getElementById('payment-confirmed').checked;

            if (!name || !address) { alert('Nama dan Nomor Meja / Alamat wajib diisi!'); return; }
            if (!payment) { alert('Silakan pilih metode pembayaran terlebih dahulu!'); return; }
            if (!confirmed) { alert('Wajib mencentang kotak konfirmasi pembayaran!'); return; }
            if (cart.length === 0) { alert('Keranjang kosong!'); return; }

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const newOrder = {
                id: 'ORD-' + Date.now().toString().slice(-6),
                date: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
                name, address, payment,
                items: [...cart],
                total,
                status: 'Pending'
            };

            let orders = JSON.parse(localStorage.getItem('mb_orders')) || [];
            orders.unshift(newOrder);
            localStorage.setItem('mb_orders', JSON.stringify(orders));

            document.getElementById('success-sound').play().catch(e => console.log(e));

            alert(`Terima kasih ${name}! Pesanan berhasil dibuat dengan ID: ${newOrder.id}. Status: Pending.`);
            
            cart = [];
            updateCartUI();
            toggleCart();
            document.getElementById('buyer-name').value = '';
            document.getElementById('buyer-address').value = '';
            document.getElementById('payment-confirmed').checked = false;
        }

        function checkOrderStatus() {
            const key = document.getElementById('track-id').value.trim().toLowerCase();
            const resultDiv = document.getElementById('track-result');
            if (!key) { resultDiv.innerHTML = `<p class="text-red-500 text-xs">Masukkan ID atau Nama Anda.</p>`; return; }

            const orders = JSON.parse(localStorage.getItem('mb_orders')) || [];
            const found = orders.filter(o => o.id.toLowerCase().includes(key) || o.name.toLowerCase().includes(key));

            if (found.length === 0) {
                resultDiv.innerHTML = `<p class="text-gray-500 text-xs mt-2">Pesanan tidak ditemukan.</p>`;
                return;
            }

            let html = `<div class="mt-3 space-y-2 text-xs">`;
            found.forEach(o => {
                let badgeColor = o.status === 'Diproses' ? 'bg-blue-100 text-blue-800' : (o.status === 'Selesai' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800');
                let noteMsg = o.status === 'Selesai' ? 'Terima kasih telah memesan di Mie Bangka Teladan! Pesanan Anda telah selesai.' : (o.status === 'Diproses' ? 'Pesanan Anda sedang diproses oleh dapur.' : 'Pesanan menunggu verifikasi admin (Pending).');
                html += `
                    <div class="p-3 bg-sky-50 rounded-xl border border-sky-200">
                        <div class="flex justify-between font-bold"><span>ID: ${o.id}</span> <span class="px-2 py-0.5 rounded-full ${badgeColor}">Status: ${o.status}</span></div>
                        <div>Pemesan: ${o.name} (${o.address})</div>
                        <div>Total: Rp ${o.total.toLocaleString('id-ID')} | Pembayaran: ${o.payment}</div>
                        <div class="font-bold mt-1 text-sky-800">${noteMsg}</div>
                    </div>
                `;
            });
            html += `</div>`;
            resultDiv.innerHTML = html;
        }

        window.onload = initApp;
    </script>
</body>
</html>
