<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mie Bangka Teladan - Kota Tanjungpinang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f9ff; color: #1e293b; font-family: Arial, sans-serif; }
    </style>
</head>
<body class="bg-sky-50 text-slate-800 p-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 border border-sky-100 my-6">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-sky-600 text-white rounded-full flex items-center justify-center text-xl mx-auto mb-2">
                <i class="fa-solid fa-bowl-food"></i>
            </div>
            <h1 class="text-xl font-extrabold text-sky-950">Mie Bangka Teladan</h1>
            <p class="text-xs text-slate-500">Kota Tanjungpinang (Topping B2 Non-Halal)</p>
        </div>

        <form id="formPesan" onsubmit="kirimPesanan(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nama Pemesan</label>
                <input type="text" id="namaPemesan" required placeholder="Nama Anda" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Pilihan Menu</label>
                <select id="pilihanMenu" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                    <option value="Mie Bangka Special (Topping B2)">Mie Bangka Special (Topping B2)</option>
                    <option value="Mie Bangka Jumbo (Topping B2)">Mie Bangka Jumbo (Topping B2)</option>
                    <option value="Es Jeruk Kunci Bangka">Es Jeruk Kunci Bangka</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Catatan</label>
                <input type="text" id="catatanPesanan" placeholder="Misal: kuah dipisah" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button type="submit" id="btnKirim" class="w-full bg-sky-600 text-white font-bold py-3 rounded-xl hover:bg-sky-700 transition shadow text-sm">
                Kirim Pesanan
            </button>
            <p id="statusPesan" class="text-center text-sm font-bold mt-2" aria-live="polite"></p>
        </form>
    </div>

    <script>
        async function kirimPesanan(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKirim');
            const statusEl = document.getElementById('statusPesan');

            btn.disabled = true;
            statusEl.className = "text-center text-sm font-bold mt-2 text-sky-600";
            statusEl.innerText = "Mengirim pesanan...";

            try {
                const res = await fetch('/api/pesanan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nama: document.getElementById('namaPemesan').value,
                        menu: document.getElementById('pilihanMenu').value,
                        catatan: document.getElementById('catatanPesanan').value,
                        waktu: new Date().toLocaleString('id-ID')
                    })
                });

                const hasil = await res.json();
                if (hasil.success) {
                    statusEl.className = "text-center text-sm font-bold mt-2 text-emerald-600";
                    statusEl.innerText = "Pesanan berhasil dikirim ke server!";
                    document.getElementById('formPesan').reset();
                } else {
                    throw new Error(hasil.error || "Gagal");
                }
            } catch (err) {
                statusEl.className = "text-center text-sm font-bold mt-2 text-red-600";
                statusEl.innerText = "Gagal mengirim: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
