<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mie Bangka Teladan - Kota Tanjungpinang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body class="pb-24">

  <!-- Banner Restoran Tutup -->
  <div id="banner-tutup" class="hidden bg-red-600 text-white text-center py-2 px-4 text-sm font-semibold sticky top-0 z-50 shadow-md">
    <i class="fa-solid fa-triangle-exclamation mr-1"></i> Mohon Maaf, Restoran saat ini sedang TUTUP / OFFLINE. Pesanan tidak dapat diproses.
  </div>

  <!-- Header -->
  <header class="bg-sky-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-white text-sky-600 p-2 rounded-full w-10 h-10 flex items-center justify-center font-bold">
          <i class="fa-solid fa-bowl-rice text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Mie Bangka Teladan</h1>
          <p class="text-xs text-sky-100"><i class="fa-solid fa-location-dot"></i> Kota Tanjungpinang</p>
        </div>
      </div>
      <button onclick="toggleKeranjang()" class="relative bg-white text-sky-700 px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count" class="bg-sky-600 text-white rounded-full px-2 py-0.5 text-xs">0</span>
      </button>
    </div>
  </header>

  <!-- Content Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Info Jam Operasional -->
    <div class="bg-sky-50 border border-sky-200 rounded-xl p-3 text-xs text-sky-800 flex justify-between items-center">
      <div>
        <i class="fa-regular fa-clock mr-1"></i> Jam Operasional: <span class="font-semibold">08:00 - 20:00 WIB</span>
      </div>
      <span class="font-bold text-sky-700">Resto Siap Melayani</span>
    </div>

    <!-- Filter Menu -->
    <div class="flex gap-2 overflow-x-auto pb-1">
      <button onclick="filterKategori('semua')" class="btn-kategori bg-sky-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm">Semua Menu</button>
      <button onclick="filterKategori('makanan')" class="btn-kategori bg-white border border-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm">Makanan</button>
      <button onclick="filterKategori('minuman')" class="btn-kategori bg-white border border-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm">Minuman</button>
    </div>

    <!-- Daftar Menu Grid -->
    <div id="menu-container" class="grid grid-cols-1 gap-4">
      <p class="text-center text-gray-500 text-sm py-8">Memuat menu...</p>
    </div>

  </main>

  <!-- Modal Keranjang & Checkout -->
  <div id="modal-keranjang" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-2xl p-4 max-h-[85vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800"><i class="fa-solid fa-basket-shopping text-sky-600"></i> Keranjang Belanja</h3>
        <button onclick="toggleKeranjang()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="cart-items" class="space-y-3 text-sm divide-y">
        <!-- Item keranjang dimasukkan via JS -->
      </div>

      <div class="border-t pt-3 space-y-3">
        <div class="flex justify-between font-bold text-base">
          <span>Total Bayar:</span>
          <span id="cart-total" class="text-sky-700">Rp 0</span>
        </div>

        <form id="form-pesanan" onsubmit="kirimPesanan(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-700">Nama Pemesan</label>
            <input type="text" id="nama_pemesan" required placeholder="Contoh: Budi" class="w-full text-sm p-2 border rounded-lg mt-1 focus:ring-2 focus:ring-sky-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700">Nomor Meja / Keterangan</label>
            <input type="text" id="nomor_meja" required placeholder="Contoh: Meja 03 / Takeaway" class="w-full text-sm p-2 border rounded-lg mt-1 focus:ring-2 focus:ring-sky-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700">Catatan Tambahan (Opsional)</label>
            <textarea id="catatan" placeholder="Contoh: Minta kuah dipisah, pedas sedang" class="w-full text-sm p-2 border rounded-lg mt-1 focus:ring-2 focus:ring-sky-500 outline-none" rows="2"></textarea>
          </div>
          <button id="btn-submit" type="submit" class="w-full bg-sky-600 text-white font-bold py-2.5 rounded-xl text-sm shadow-md hover:bg-sky-700 transition">
            Kirim Pesanan Sekarang
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bshjfhjwfbdwtdqphjla.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-RoutcoL6TizW60mnEkB7Q_Hn7Zgy1Z";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listMenu = [];
    let cart = [];
    let tokoBuka = true;

    async function init() {
      await cekStatusToko();
      await loadMenu();
    }

    async function cekStatusToko() {
      const { data, error } = await supabaseClient.from('settings').select('*').eq('key', 'store_status').single();
      if (data) {
        tokoBuka = data.value === 'open';
        const banner = document.getElementById('banner-tutup');
        const btnSubmit = document.getElementById('btn-submit');
        if (!tokoBuka) {
          banner.classList.remove('hidden');
          if (btnSubmit) {
            btnSubmit.disabled = true;
            btnSubmit.classList.add('bg-gray-400');
            btnSubmit.innerText = 'Toko Sedang Tutup';
          }
        } else {
          banner.classList.add('hidden');
        }
      }
    }

    async function loadMenu() {
      const { data, error } = await supabaseClient.from('menus').select('*').eq('is_available', true);
      if (error) {
        console.error('Error fetching menu:', error);
        return;
      }
      listMenu = data || [];
      renderMenu(listMenu);
    }

    function renderMenu(items) {
      const container = document.getElementById('menu-container');
      if (items.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 text-sm py-8">Tidak ada menu yang tersedia saat ini.</p>`;
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex gap-3 items-center">
          <img src="${item.image_url || 'https://via.placeholder.com/100'}" alt="${item.name}" class="w-20 h-20 object-cover rounded-xl bg-gray-100">
          <div class="flex-1">
            <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
            <p class="text-xs text-gray-500 line-clamp-1">${item.description || ''}</p>
            <div class="mt-2 flex justify-between items-center">
              <span class="font-extrabold text-sky-700 text-sm">Rp ${Number(item.price).toLocaleString('id-ID')}</span>
              <button onclick="addToCart(${item.id})" class="bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg font-semibold hover:bg-sky-700 active:scale-95 transition">
                + Tambah
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      if (!tokoBuka) {
        alert('Mohon maaf, restoran saat ini sedang TUTUP.');
        return;
      }
      const item = listMenu.find(m => m.id === id);
      if (!item) return;

      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const count = cart.reduce((acc, c) => acc + c.qty, 0);
      document.getElementById('cart-count').innerText = count;

      const itemsContainer = document.getElementById('cart-items');
      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p class="text-center text-gray-400 py-4">Keranjang masih kosong</p>';
      } else {
        itemsContainer.innerHTML = cart.map((c, index) => `
          <div class="flex justify-between items-center pt-2">
            <div>
              <p class="font-semibold text-gray-800">${c.name}</p>
              <p class="text-xs text-gray-500">Rp ${Number(c.price).toLocaleString('id-ID')} x ${c.qty}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeQty(${index}, -1)" class="w-6 h-6 bg-gray-200 rounded-full text-xs font-bold">-</button>
              <span class="text-xs font-bold">${c.qty}</span>
              <button onclick="changeQty(${index}, 1)" class="w-6 h-6 bg-sky-600 text-white rounded-full text-xs font-bold">+</button>
            </div>
          </div>
        `).join('');
      }

      const total = cart.reduce((acc, c) => acc + (c.price * c.qty), 0);
      document.getElementById('cart-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    }

    function toggleKeranjang() {
      document.getElementById('modal-keranjang').classList.toggle('hidden');
    }

    async function kirimPesanan(e) {
      e.preventDefault();
      if (!tokoBuka) {
        alert('Restoran sedang tutup, pesanan tidak dapat dikirim.');
        return;
      }
      if (cart.length === 0) {
        alert('Keranjang Anda masih kosong!');
        return;
      }

      const nama = document.getElementById('nama_pemesan').value;
      const meja = document.getElementById('nomor_meja').value;
      const catatan = document.getElementById('catatan').value;
      const total = cart.reduce((acc, c) => acc + (c.price * c.qty), 0);

      const payload = {
        order_id: 'MB-' + Math.floor(1000 + Math.random() * 9000),
        customer_name: nama,
        table_number: meja,
        notes: catatan,
        items: cart,
        total_price: total,
        status: 'pending'
      };

      const { data, error } = await supabaseClient.from('orders').insert([payload]);

      if (error) {
        alert('Gagal mengirim pesanan: ' + error.message);
      } else {
        alert('Pesanan berhasil dikirim! Silakan tunggu konfirmasi kasir/dapur.');
        cart = [];
        updateCartUI();
        toggleKeranjang();
        document.getElementById('form-pesanan').reset();
      }
    }

    init();
  </script>
</body>
</html>
